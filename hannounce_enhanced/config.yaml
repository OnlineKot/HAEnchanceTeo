name: HAnnounce Enhanced
version: "1.13.0"
slug: hannounce_enhanced
description: Announce on speakers - TTS, your own recordings, uploads, generated sounds, one-time or saved. By TeodorTeo.com
url: https://teodorteo.com
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:bullhorn
panel_title: HAnnounce
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: "Audio files for speakers + optional API (needs api_key)"
options:
  base_url: ""
  api_key: ""
  max_upload_mb: 20
  status_sensor: true
  check_external_ip: true
  external_host: ""
  log_level: info
schema:
  base_url: str?
  api_key: password?
  max_upload_mb: int(1,100)
  status_sensor: bool
  check_external_ip: bool
  external_host: str?
  log_level: list(debug|info|warning)
