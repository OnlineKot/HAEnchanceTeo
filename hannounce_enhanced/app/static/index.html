<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAnnounce Enhanced</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HAnnounce">
<meta name="theme-color" content="#03a9f4">
<style>
/* Home Assistant look: theme variables from home-assistant/frontend, one accent colour (primary), 3 text sizes (12 / 14 / 16), 8-16-24 spacing, one 12px radius, no shadows, only 120 ms fades. */
@font-face{font-family:Roboto;font-weight:400;font-display:swap;src:local("Roboto"),url("/static/fonts/roboto/Roboto-Regular.woff2") format("woff2")}
@font-face{font-family:Roboto;font-weight:500;font-display:swap;src:local("Roboto Medium"),url("/static/fonts/roboto/Roboto-Medium.woff2") format("woff2")}
:root{--primary-color:#009ac7;--rgb-primary-color:0,154,199;--primary-text-color:#212121;--secondary-text-color:#727272;--primary-background-color:#fafafa;--card-background-color:#fff;--secondary-background-color:#e5e5e5;--divider-color:rgba(0,0,0,.12);--outline-color:rgba(0,0,0,.12);--shadow-color:rgba(0,0,0,.16);--error-color:#db4437;--warning-color:#ffa600;--success-color:#43a047;--input-fill-color:rgb(245,245,245);--input-idle-line-color:rgba(0,0,0,.42);--input-label-ink-color:rgba(0,0,0,.6);--ha-font:Roboto,Noto,"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;--bg:var(--primary-background-color);--card:var(--card-background-color);--fg:var(--primary-text-color);--mut:var(--secondary-text-color);--acc:var(--primary-color);--accbg:rgba(var(--rgb-primary-color),.12);--bd:var(--divider-color);--ok:var(--success-color);--warn:#b26a00;--err:var(--error-color)}
@media (prefers-color-scheme:dark){:root{--primary-background-color:#111;--card-background-color:#1c1c1c;--secondary-background-color:#282828;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:rgba(225,225,225,.12);--outline-color:rgba(225,225,225,.12);--shadow-color:rgba(0,0,0,.48);--input-fill-color:rgba(255,255,255,.05);--input-idle-line-color:rgba(255,255,255,.42);--input-label-ink-color:rgba(255,255,255,.6);--warn:#ffa600}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/20px var(--ha-font);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
[hidden]{display:none!important}
main{max-width:640px;margin:0 auto;padding:8px 8px 24px}
header{display:flex;align-items:center;height:56px;margin:-8px -8px 8px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font:500 16px/24px var(--ha-font);margin:0}
html.embedded header{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px}
.card.pad{padding:12px 16px}
.body{padding:16px}
small{font-size:12px;color:var(--mut)}
.hint{color:var(--mut);font-size:12px;line-height:18px;margin:8px 0 0}.hint+.hint{margin-top:8px}
.rec{color:var(--err);font-weight:500}
.empty{color:var(--mut);padding:8px 0}
code,pre{font:12px/18px ui-monospace,SFMono-Regular,Menlo,monospace}
code{background:var(--input-fill-color);padding:1px 4px;border-radius:6px;word-break:break-all}
pre{background:var(--input-fill-color);padding:8px 16px;border-radius:var(--r);overflow:auto;margin:8px 0 0}

/* tabs */
.tabs{display:flex;overflow-x:auto;padding:0 8px;border-bottom:1px solid var(--bd);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:12px 8px;margin:0 4px;cursor:pointer;font:500 14px/20px var(--ha-font);white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{display:none}.pane.on{display:block}

/* sections: whitespace and hairlines instead of boxes */
.sec{display:flex;align-items:center;margin:0 0 8px;color:var(--mut);font:500 12px/16px var(--ha-font)}
.sec .sp{flex:1}
.sec .link{margin:-8px 0}.sec .link:last-child{margin-right:-8px}
.part+.part{border-top:1px solid var(--bd);margin-top:16px;padding-top:16px}
#tgt{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--bd)}
.link{background:none;border:0;border-radius:var(--r);color:var(--acc);cursor:pointer;font:500 14px/20px var(--ha-font);padding:6px 8px}
.link:hover{background:var(--accbg)}.link.err{color:var(--err)}
details>summary{cursor:pointer;color:var(--mut)}
details.opts{margin-top:16px}details.opts[open]>summary{margin-bottom:8px}
details.help{margin-top:16px}details.help>summary,details.opts>summary,details.more>summary{font:500 12px/16px var(--ha-font)}
details.help>div,details.more>div{margin-top:8px}
details.help .hint,details.more .hint{margin:0}
details.help>div>.hint+.hint,details.more>div>.hint+.hint,details.more .hint:not(:first-child){margin-top:8px}
details.help h3+.hint{margin-top:4px}
details.help h3{font:500 14px/20px var(--ha-font);color:var(--fg);margin:16px 0 0}
details.help h3:first-child{margin-top:0}
details.more{margin-top:16px}

/* controls */
label.f{display:block;margin:16px 0 4px;color:var(--input-label-ink-color);font:500 12px/16px var(--ha-font)}
label.chk{display:flex;gap:16px;align-items:center;margin:16px 0 0}
.row{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:flex-end;margin-top:16px}
.row>.grow{flex:1 1 140px;min-width:0}.row>.grow.w2{flex:2 1 200px}.row>.grow.w1{flex:1 1 100px}
.row label.f,.pane>:first-child,.part>:first-child{margin-top:0}
input[type=text],input[type=number],input[type=search],input[type=time],select,textarea{width:100%;min-height:48px;padding:12px 16px;border:1px solid var(--outline-color);border-radius:var(--r);background:var(--input-fill-color);color:var(--fg);font:400 16px/24px var(--ha-font)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=color]{width:100%;height:48px;padding:4px;border:1px solid var(--outline-color);border-radius:var(--r);background:var(--input-fill-color)}
input[type=file]{width:100%;font:14px/20px var(--ha-font);color:var(--mut)}
input[type=file]::file-selector-button{margin-right:16px;height:40px;padding:0 24px;border:0;border-radius:var(--r);background:none;box-shadow:inset 0 0 0 1px var(--outline-color);color:var(--acc);font:500 14px/20px var(--ha-font);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--acc)}
textarea{min-height:72px;resize:vertical}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:24px;margin:0;border-radius:var(--r);border:1px solid var(--input-idle-line-color);background:none;position:relative;cursor:pointer}
input[type=checkbox]::after{content:"";position:absolute;top:5px;left:5px;width:12px;height:12px;border-radius:50%;background:var(--input-idle-line-color)}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{top:3px;left:23px;width:16px;height:16px;background:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.recopts{align-items:center}.recopts select{width:auto;min-height:40px;padding:8px 16px}
audio{width:100%;margin-top:16px}

/* buttons: one filled (.b) per view; everything else is outlined (.alt) or text (.txt / .sm / .link) */
.b{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:40px;padding:0 24px;border:0;border-radius:var(--r);background:var(--acc);color:#fff;cursor:pointer;font:500 14px/20px var(--ha-font);text-decoration:none}
.b:hover{filter:brightness(.92)}.b:active{filter:brightness(.82)}
.b.alt{background:none;color:var(--acc);box-shadow:inset 0 0 0 1px var(--outline-color)}
.b.txt,.b.sm{background:none;color:var(--acc);padding:0 16px}
.b.sm{height:32px;padding:0 8px}
.b.alt:hover,.b.txt:hover,.b.sm:hover,.b.alt:active,.b.txt:active,.b.sm:active{background:var(--accbg);filter:none}
.b.sm.on{background:var(--accbg)}
.b.red,.b.mut{background:none;color:var(--err)}.b.mut{color:var(--mut)}.b.red:hover,.b.mut:hover,.b.red:active,.b.mut:active{background:rgba(219,68,55,.1);filter:none}.b.mut:hover,.b.mut:active{color:var(--err)}
.b:disabled,.link:disabled,.chip:disabled,.tile:disabled,.star-btn:disabled{opacity:.5;cursor:default}.busy{cursor:progress!important}
label.b{margin:0}
.acts{display:flex;flex-wrap:wrap;flex:0 0 100%}.acts>:first-child{margin-left:-8px}.acts.ind{margin-left:32px;flex-basis:calc(100% - 32px)}.acts.ind>:first-child{margin-left:0}
.tools{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.tools .b.sm:first-child,#libFav{margin-left:-8px}
.tools input[type=search]{flex:1 1 100%}
.tools label.chk{margin:0;gap:8px}
.btnrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.btnrow .b.txt{padding:0 8px}.btnrow>.b:not(.txt):not(.sm){flex:1 1 100%}.btnrow>.b:not(.txt):not(.sm)+.b.txt{margin-left:-8px}
.tools{gap:0 16px;margin-bottom:8px}#libList{margin-top:16px}

/* targets */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--outline-color);background:none;color:var(--fg);cursor:pointer;font:500 14px/20px var(--ha-font)}
.chip:hover{border-color:var(--acc)}
.chip.on,.chip:active{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.chip .star{color:var(--acc);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);opacity:.5;flex:none;display:inline-block}
.dot.playing,.dot.buffering{background:var(--acc);opacity:1}.dot.unavailable{background:var(--err);opacity:1}
#qRecent{margin-top:8px}#qRecent:empty{display:none}#qRecent .chip{min-height:32px;padding:0 12px;border-color:transparent;background:var(--input-fill-color);color:var(--mut);font-weight:400}
#qRecent .chip:hover{color:var(--acc)}
#qGo{width:100%;margin-top:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{min-height:56px;padding:8px 16px;border-radius:var(--r);border:1px solid var(--outline-color);background:none;color:var(--fg);cursor:pointer;font:inherit;text-align:left;display:flex;flex-direction:column;justify-content:center}
.tile:hover,.tile:active{border-color:var(--acc)}.tile:active{background:var(--accbg)}.tile b{font-weight:500}.tiles .empty{grid-column:1/-1;padding:0}

/* lists */
.item{display:flex;gap:0 8px;align-items:flex-start;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0;padding-top:0}.item:last-child{padding-bottom:0}
.item .n{flex:1 1 0;min-width:0}
.star-btn{background:none;border:0;border-radius:var(--r);width:32px;height:32px;margin:-4px 0;font-size:16px;line-height:32px;cursor:pointer;color:var(--mut);padding:0}
.star-btn.on{color:var(--acc)}.star-btn:hover{background:var(--accbg)}
.badges{color:var(--mut);font-size:12px;line-height:18px}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.err{color:var(--err)}
.spk{padding:16px 0;border-top:1px solid var(--bd)}.spk:first-child{border-top:0;padding-top:0}.spk:last-child{padding-bottom:0}
.spk.dup{opacity:.75}
.spk .head{display:flex;gap:0 8px;align-items:flex-start;flex-wrap:wrap}.spk .head .n{flex:1 1 0;min-width:0}
.prof{margin-top:8px;padding-top:8px}
.prof .row:first-child,.prof label.f:first-child{margin-top:8px}

/* announcing now */
#nowBar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:624px;margin:0 auto;z-index:8}
body.has-now main{padding-bottom:112px}
#nowBar .nrow{display:flex;gap:16px;align-items:center;padding:8px 0}#nowBar .nrow+.nrow{border-top:1px solid var(--bd)}
#nowBar .pulse{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
#nowBar .pulse.q{background:var(--mut)}
#nowBar .bar{height:2px;background:var(--bd);margin-top:8px;border-radius:1px;overflow:hidden}#nowBar .bar i{display:block;height:100%;background:var(--acc)}
#nowBar .hint{margin:0}

/* recording */
.meter{height:4px;border-radius:2px;margin-top:8px;overflow:hidden}.meter+.row{margin-top:8px}.meter.live{background:var(--bd)}.meter i{display:block;height:100%;width:0;background:var(--err)}

#toast{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);background:#323232;color:#fff;padding:12px 16px;border-radius:var(--r);opacity:0;pointer-events:none;max-width:90%;z-index:9;transition:opacity .12s}
#toast.on{opacity:1}
footer{text-align:center;color:var(--mut);font-size:12px;line-height:18px;margin:24px 0 8px}
footer a{color:var(--acc);text-decoration:none;font-weight:500}
.kiosk .tabs,.kiosk footer,.kiosk #scriptRes{display:none}
#updBanner{margin:0 0 16px;color:var(--fg)}#updBanner .b.sm{margin-top:8px}
.tkres,#tokForm{margin:16px 0;padding:16px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.n>small{display:block}
#netInfo .hint{margin:0;min-height:18px}#netInfo .hint+.hint{margin-top:0}
#recHint:empty{display:none}
#spkList{margin-top:16px}
.tools+details.help{margin-top:0}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.b,.chip,.tile,.link,.star-btn,input,select,textarea{transition:background-color .12s,border-color .12s,color .12s,opacity .12s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body:not(.ready) main>:not(header){visibility:hidden}   /* first paint waits for the data, so nothing jumps while it arrives */
#lvPhones,#lvOnly,#tkLive{min-height:40px}
</style>
<script>try{if(window.self!==window.top)document.documentElement.classList.add("embedded")}catch(e){document.documentElement.classList.add("embedded")}</script>
</head>
<body>
<main>
<header><h1>HAnnounce Enhanced</h1></header>

<div class="card pad" id="nowBar" hidden></div>

<div class="card" id="main">
<div class="tabs" id="tabs"></div>
<div class="body">

  <div id="tgt">
    <div class="sec"><span data-i="targets"></span><span class="sp"></span>
      <button class="link" id="selFav">★ <span data-i="favs"></span></button>
      <button class="link" id="selAll" data-i="all"></button>
      <button class="link" id="selNone" data-i="none"></button>
      <button class="link err" id="stopAll" data-i="stop2"></button></div>
    <div class="chips" id="players"></div>
    <details class="opts">
      <summary data-i="options"></summary>
      <div class="row">
        <div class="grow"><label class="f" data-i="actBefore"></label><select id="actBefore"></select></div>
        <div class="grow"><label class="f" data-i="actAfter"></label><select id="actAfter"></select></div>
      </div>
      <label class="chk"><input type="checkbox" id="volOn"> <span><span data-i="setvol"></span>: <b id="volVal">50</b>%</span></label>
      <input type="range" id="vol" min="0" max="100" value="50" style="margin-top:8px">
    </details>
  </div>

  <div class="pane" id="p-quick">
    <div class="part">
      <textarea id="qMsg" data-ph="qMsg"></textarea>
      <button class="b" id="qGo" data-i="announce"></button>
      <div class="chips" id="qRecent"></div>
    </div>
    <div class="part">
      <div class="sec" data-i="qSounds"></div>
      <div class="tiles" id="qTiles"></div>
    </div>
  </div>

  <div class="pane" id="p-say">
    <label class="f" data-i="message"></label><textarea id="ttsMsg"></textarea>
    <label class="f" data-i="ttsent"></label><select id="ttsEnt"></select>
    <div class="row">
      <div class="grow"><label class="f" data-i="lang"></label><select id="ttsLang"></select></div>
      <div class="grow"><label class="f" data-i="voice"></label><select id="ttsVoice"></select></div>
    </div>
    <audio id="sayAudio" controls hidden></audio>
    <div class="btnrow"><button class="b" id="sayGo" data-i="announce"></button>
      <button class="b txt" id="sayPrev" data-i="preview"></button>
      <button class="b txt" id="saySave" data-i="save"></button></div>
  </div>

  <div class="pane" id="p-rec">
    <div class="btnrow">
      <button class="b" id="recBtn" data-i="rec"></button>
      <label class="b txt"><span data-i="devrec"></span>
        <input type="file" id="recFile" accept="audio/*,.m4a,.caf,.aac,.wav,.mp3,.ogg,.opus" style="display:none"></label>
    </div>
    <div class="meter" id="recMeter"><i id="recLvl"></i></div>
    <div class="row recopts">
      <label class="chk"><input type="checkbox" id="recCount" checked><span data-i="recCount"></span></label>
      <label class="chk"><input type="checkbox" id="recNs" checked><span data-i="recNs"></span></label>
      <select id="recMax"><option value="30">30 s</option><option value="60" selected>60 s</option><option value="120">2 min</option><option value="300">5 min</option></select>
    </div>
    <div class="hint" id="recHint"></div>
    <details class="help" id="recHelp" hidden><summary data-i="recHelpT"></summary><div><div class="hint" data-i="recHelp1"></div><div class="hint" data-i="recHelp2"></div><div class="hint" data-i="recHelp3"></div></div></details>
    <audio id="recAudio" controls hidden></audio>
    <div class="out" id="recOut" hidden></div>
  </div>

  <div class="pane" id="p-up">
    <input type="file" id="upFile" accept="audio/*,video/mp4" aria-label="Audio file">
    <audio id="upAudio" controls hidden></audio>
    <div class="out" id="upOut" hidden></div>
  </div>

  <div class="pane" id="p-gen">
    <div class="row">
      <div class="grow"><label class="f" data-i="type"></label><select id="gType"></select></div>
      <div class="grow"><label class="f" data-i="freq"></label><input type="number" id="gFreq" min="50" max="8000" placeholder="auto"></div>
      <div class="grow"><label class="f" data-i="dur"></label><input type="number" id="gDur" min="0.1" max="20" step="0.1" placeholder="auto"></div>
      <div class="grow"><label class="f" data-i="rep"></label><input type="number" id="gRep" min="1" max="10" value="1"></div>
    </div>
    <audio id="gAudio" controls hidden></audio>
    <div class="btnrow"><button class="b txt" id="gPrev" data-i="preview"></button></div>
    <div class="out" id="gOut"></div>
  </div>

  <div class="pane" id="p-lib">
    <div class="tools">
      <input type="search" id="libQ" data-ph="search">
      <button class="b sm" id="libFav">★ <span data-i="favs"></span></button>
      <button class="b sm" id="libDup" data-i="dedupe"></button>
    </div>
    <div id="libList"></div>
  </div>

  <div class="pane" id="p-spk">
    <div class="tools">
      <button class="b sm" id="spkScan" data-i="rescan"></button>
      <button class="b sm" id="spkDup" data-i="dedupeSpk"></button>
      <label class="chk"><input type="checkbox" id="spkHidden"> <span data-i="showHidden"></span></label>
    </div>
    <details class="help"><summary data-i="help"></summary><div><div class="hint" data-i="spkHint"></div></div></details>
    <div id="spkList"></div>
  </div>

  <div class="pane" id="p-live">
    <div class="sec"><span data-i="liveTitle"></span></div>
    <details class="help"><summary data-i="help"></summary><div><div class="hint" data-i="liveInfo"></div><div class="hint" data-i="lvOnlyHint"></div><div class="hint" data-i="lvMsgHint"></div></div></details>
    <label class="chk"><input type="checkbox" id="lvOn"> <span data-i="lvOn"></span></label>
    <label class="f" data-i="lvPhones"></label><div class="chips" id="lvPhones"></div>
    <label class="f" data-i="lvOnly"></label><div class="chips" id="lvOnly"></div>
    <div class="row"><div class="grow"><label class="f" data-i="lvTitle"></label><input type="text" id="lvTitle"></div>
      <div class="grow"><label class="f" data-i="lvCrit"></label><input type="text" id="lvCrit"></div></div>
    <label class="f" data-i="lvMsg"></label><input type="text" id="lvMsg">
    <label class="chk"><input type="checkbox" id="lvHide"> <span data-i="lvHide"></span></label>
    <label class="chk"><input type="checkbox" id="lvCount"> <span data-i="lvCount"></span></label>
    <details class="more"><summary data-i="lvAdv"></summary>
      <div class="row"><div class="grow"><label class="f" data-i="lvIcon"></label><select id="lvIconSel"></select></div>
        <div class="grow"><label class="f">mdi:</label><input type="text" id="lvIcon"></div>
        <div class="grow"><label class="f" data-i="lvColor"></label><input type="color" id="lvColor"></div></div>
      <div class="row"><div class="grow"><label class="f">background_color</label><input type="text" id="lvBg" placeholder="#101820"></div>
        <div class="grow"><label class="f">text_color</label><input type="text" id="lvTx" placeholder="#FFFFFF"></div>
        <div class="grow"><label class="f">relevance_score 0–1</label><input type="number" id="lvRel" step="0.1" min="0" max="1"></div>
        <div class="grow"><label class="f" data-i="lvEnd"></label><input type="number" id="lvEnd" step="1" min="0" max="60"></div></div>
      <label class="f" data-i="lvUrl"></label><input type="text" id="lvUrl" placeholder="/lovelace/0"></details>

async function api(p, o = {}, retry = true){
  const h = new Headers(o.headers || {});
  if(key.get()) h.set("Authorization", "Bearer " + key.get());
  const r = await fetch("api/" + p, {...o, headers:h});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401 && retry){
    const k = prompt(t("askkey"));
    if(k){ key.set(k.trim()); return api(p, o, false); }
  }
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---- smooth updates: in-flight state on buttons, and in-place DOM patching (no flicker, keeps focus, scroll and open <details>)
async function busy(el, fn){            // disables the control while its request is running (also stops double taps)
  if(el){ if(el.disabled) return; el.disabled = true; el.classList.add("busy"); }
  try{ return await fn(); } finally{ if(el){ el.disabled = false; el.classList.remove("busy"); } }
}
function setOptions(sel, html){         // rebuild <option>s only when they changed and keep the current choice
  if(sel.dataset.sig === html) return;

// Keyed list: existing elements are updated in place (upd), new ones created (make), gone ones removed, order kept.
function patchList(box, items, o){
  box.querySelectorAll(":scope>.empty").forEach(e => e.remove());
  if(o.hold){   // keep the rows where they are (e.g. right after a star tap) - they are re-sorted the next time the list is opened
    const pos = [...box.children].map(e => e.dataset.k), at = it => pos.indexOf(String(o.key(it)));
    items = [...items].sort((a, b) => (at(a) < 0 ? -1 : at(a)) - (at(b) < 0 ? -1 : at(b)));
  }
  const old = new Map([...box.children].map(e => [e.dataset.k, e]));
  let prev = null;
  items.forEach(it => {
    const k = String(o.key(it)); let el = old.get(k);
    if(el) old.delete(k); else { el = o.make(it); el.dataset.k = k; }
    el._it = it; if(o.upd) o.upd(el, it);
    const want = prev ? prev.nextElementSibling : box.firstElementChild;
    if(el !== want) box.insertBefore(el, want);
    prev = el;
  });
  old.forEach(e => e.remove());
  if(o.empty){ const d = document.createElement("div"); d.className = "empty"; d.textContent = o.empty; box.append(d); }
}

function setRec(blob, secs){
  blobRec = blob; $("recAudio").src = URL.createObjectURL(blob); $("recAudio").hidden = false; $("recOut").hidden = false;
  $("recHint").textContent = (secs ? secs.toFixed(0) + " s · " : "") + (blob.size/1024 < 1024 ? (blob.size/1024).toFixed(0) + " KB" : (blob.size/1048576).toFixed(1) + " MB") + " · " + t("recAgain");

const canMic = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder && window.isSecureContext);

function stopMeter(){ cancelAnimationFrame(raf); if(actx){ actx.close().catch(()=>{}); actx = null; } $("recLvl").style.width = "0"; $("recMeter").classList.remove("live"); }
function startMeter(stream){
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)(); const an = actx.createAnalyser(); an.fftSize = 512;
    actx.createMediaStreamSource(stream).connect(an); const buf = new Uint8Array(an.fftSize); $("recMeter").classList.add("live");
    const loop = () => { an.getByteTimeDomainData(buf); let m = 0; for(const v of buf) m = Math.max(m, Math.abs(v - 128)); $("recLvl").style.width = Math.min(100, m / 100 * 100) + "%"; raf = requestAnimationFrame(loop); };
    loop();
  }catch{ /* meter is optional */ }
}
const wait = ms => new Promise(r => setTimeout(r, ms));
let recBusy = false;
$("recBtn").onclick = async () => {
  if(mr && mr.state === "recording"){ mr.stop(); return; }
  if(recBusy) return; recBusy = true;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:$("recNs").checked, noiseSuppression:$("recNs").checked, autoGainControl:true}});
    if($("recCount").checked){ for(let i = 3; i > 0; i--){ $("recBtn").textContent = i + "…"; await wait(1000); } }
    const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"].find(m => MediaRecorder.isTypeSupported(m));
    mr = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream); chunks = [];
    const max = +$("recMax").value, t0 = Date.now();
    mr.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(x => x.stop()); clearInterval(tick); stopMeter();
      $("recBtn").textContent = t("rec"); recBusy = false;
      if(chunks.length) setRec(new Blob(chunks, {type:mr.mimeType || mime || "audio/webm"}), (Date.now() - t0) / 1000);
    };
    mr.start(250); startMeter(stream);
    $("recBtn").textContent = t("stop");
    tick = setInterval(() => { const s = (Date.now() - t0) / 1000; $("recBtn").textContent = t("stop") + " · " + s.toFixed(0) + " / " + max + " s"; if(s >= max) mr.stop(); }, 250);
    recBusy = false;
  }catch(e){ recBusy = false; stopMeter(); toast(e.name === "NotAllowedError" ? t("recDenied") : e.message, true); $("recBtn").textContent = t("rec"); }
};

async function renderLog(){

    const seen = {}; rows.forEach(e => { const b = e.ts + "|" + e.source + "|" + e.said; seen[b] = (seen[b]||0) + 1; e._k = b + "#" + seen[b]; });
    patchList(box, rows, {
      key: e => e._k, empty: rows.length ? "" : t("logEmpty"),
      make: e => {
        const d = mk("div", "item", `<div class="n"><div class="badges">${bdg([[esc(new Date(e.ts*1000).toLocaleString())], [esc(e.source)], [e.ok?"✓":"✗ "+esc(e.error), e.ok?"ok":"err"]])}</div>
          <div class="tx" style="margin-top:4px"></div><small></small></div>`);
        const names = (e.targets||[]).map(x => (S.players.find(p=>p.entity_id===x)||{name:x}).name).join(", ");
        d.querySelector(".tx").textContent = e.said === "(text not recorded)" ? t("logNoText") : e.said;

}

   <div class="grow"><label class="f">${t("dQTo")}</label><input type="time" class="qt" value="${p.quiet_to}"></div></div>
   <label class="f">${t("dQVol")}</label><input type="number" min="0" max="100" class="qv" value="${pct(p.quiet_volume)}">
   <div class="btnrow"><button class="b sv">${t("dSave")}</button><button class="b txt rs">${t("dReset")}</button>
   ${eid==="_default" ? `<button class="b txt cp">${t("dCopy")}</button>` : ""}</div>`;
  f.querySelector(".rm").value = p.resume_mode;

      before_delay:+q(".bd").value||0, after_delay:+q(".ad").value||0, power_cycle:q(".pw").checked, unmute:q(".um").checked,
      quiet_from:q(".qf").value, quiet_to:q(".qt").value, quiet_volume:n(".qv")==null?null:n(".qv")/100}; };
  const save = (btn, extra={}) => busy(btn, async () => { try{ D = await post("devices",{entity_id:eid,profile:read(),...extra}); toast(t("dSaved")); renderSpk(); }catch(e){toast(e.message,true)} });
  const sv = f.querySelector(".sv"); sv.onclick = () => save(sv);

  const cp = f.querySelector(".cp"); if(cp) cp.onclick = () => save(cp, {copy_to:S.players.map(x=>x.entity_id)});
  return f;

const openProfiles = new Set();
function profileSlot(row, eid){      // (re)build the settings form only when the saved profile really changed - typing is never overwritten
  const psig = JSON.stringify(D.profiles[eid] || D.default);
  if(row._psig === psig) return;
  row._psig = psig;
  const form = profileForm(eid); form.hidden = !openProfiles.has(eid);
  const oldF = row.querySelector(":scope>.prof");
  if(oldF){ form.hidden = oldF.hidden; oldF.replaceWith(form); } else row.append(form);
}
function toggleProfile(row, eid){
  const form = row.querySelector(":scope>.prof"); form.hidden = !form.hidden;
  form.hidden ? openProfiles.delete(eid) : openProfiles.add(eid);
}
async function renderSpk(){
  try{ D = await api("devices"); }catch(e){ return toast(e.message,true); }

      if(p.entity_id === "_default"){

      }
      const row = mk("div", "spk", `<div class="head">
        <button class="star-btn"></button>

        try{ await post("speaker",{entity_id:p.entity_id,favorite:want}); await refresh(); }catch(e){ setStar(star, p.favorite); toast(e.message,true); }
      });

      return row;
    },

        const model = [p.manufacturer, p.model].filter(Boolean).join(" ");

      }
      profileSlot(row, p.entity_id);
    }
  });
}

    busy($("lnGo"), async () => {
      try{ const r = await post("launcher",{notify:$("lnPhone").value,platform:$("lnOs").value,target:$("lnTarget").value});
        showScriptResult(r, [[t("w1"), r.entity_id], [t("w2"), info.deeplink || ""], [t("w3"), info.standalone]]); }
      catch(e){ toast(e.message,true); }
    });
  };
}

// ---- live updates: the interface refreshes itself, and tells you when a new add-on version exists
let lastP = "", lastL = "";
const sigP = st => JSON.stringify(st.players.map(p=>[p.entity_id,p.state,p.favorite,p.hidden,p.duplicate_of]));
const sigL = st => JSON.stringify(st.library.map(i=>[i.id,i.name,i.favorite]));
async function live(){
  if(document.hidden) return;
  try{
    const n = await api("state");
    const p = sigP(n), l = sigL(n);
    S = n;
    if(p !== lastP){ lastP = p; renderChips(); if($("p-spk").classList.contains("on")) renderSpk(); }
    if(l !== lastL){ lastL = l; renderQuick(); renderLib(); }
  }catch{}
}
async function checkVersion(){
  try{
    const box = $("updBanner"); $("addonLogBox").hidden = !(S.admin && !document.body.classList.contains("kiosk"));
    if(!S.admin || document.body.classList.contains("kiosk")){ box.hidden = true; $("verInfo").textContent = ""; return; }   // only the HA admin sees version / update info
    const v = await api("version");
    $("verInfo").textContent = v.version ? `v${v.version} · ` + (v.auto_update ? t("updAuto") : t("updManual")) : "";
    if(v.update_available){
      const inFrame = window.top !== window;
      box.innerHTML = `<b>${t("updNew")}: v${esc(v.latest)}</b> <small>(${t("updHave")} v${esc(v.version)})</small><div class="hint" style="margin:0">${t("updHow")}</div>` +
        (inFrame && v.addon_path ? `<div><a class="b sm" href="${esc(v.addon_path)}" target="_top">${t("updOpen")}</a></div>` : "");
      box.hidden = false;
    } else box.hidden = true;
  }catch{}
}
setInterval(live, 8000);
setInterval(checkVersion, 10*60*1000);
document.addEventListener("visibilitychange", () => { if(!document.hidden){ live(); checkVersion(); } });

if(new URLSearchParams(location.search).has("quick")) document.body.classList.add("kiosk");
showTab((location.hash||"").slice(1) || "quick");
refresh().then(()=>{ lastP=sigP(S); lastL=sigL(S); checkVersion();
  if(S.admin && !document.body.classList.contains("kiosk")){ renderTokens(); renderLiveCfg(); renderHelp(); }   // admin panel: prepare the other tabs in the background, so they open without content popping in
}).catch(e => toast(e.message,true)).finally(() => document.body.classList.add("ready"));
setTimeout(() => document.body.classList.add("ready"), 4000);
$("addonLogBtn").onclick = () => busy($("addonLogBtn"), async () => { const pre = $("addonLog"); if(!pre.hidden){ pre.hidden = true; return; } try{ pre.textContent = (await api("addonlog")).lines.join("\n"); pre.hidden = false; pre.scrollTop = pre.scrollHeight; }catch(e){ toast(e.message,true); } });
</script>
