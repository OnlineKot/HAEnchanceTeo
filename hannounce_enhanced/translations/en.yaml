configuration:
  base_url:
    name: Base URL for speakers
    description: "URL speakers use to fetch audio, including port, e.g. http://192.168.1.10:8765. Leave empty to auto-detect the host IP."
  api_key:
    name: API key
    description: "Enables the external API (port 8765) for automations. Leave empty to disable it."
  max_upload_mb:
    name: Max upload size (MB)
    description: Maximum size of an uploaded or recorded file.
  status_sensor:
    name: Publish status sensor
    description: "Creates sensor.hannounce_status (idle / announcing + details) so you can see and automate on live announcements."
  check_external_ip:
    name: Check external IP
    description: "Looks up your public IP on api.ipify.org / icanhazip.com / ifconfig.me (max every 10 min), shows it next to the local IP, uses it for links from outside and publishes it as a sensor. Turn off to never contact those services."
  external_host:
    name: External host (DDNS)
    description: "Optional hostname or IP to use in links from outside the home (e.g. mydomain.duckdns.org). Leave empty to use the detected external IP."
  log_level:
    name: Log level
    description: Verbosity of the add-on log.
