name: HARemindTeo
version: "1.0.0"
slug: haremindteo
description: Reminders and timers from your phone - natural-language input, repeats, notifications with Done/Snooze, spoken announcements and a countdown on the Dynamic Island. By TeodorTeo.com
url: https://teodorteo.com
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:alarm-check
panel_title: HARemind
ports:
  8767/tcp: 8767
ports_description:
  8767/tcp: "Token API for Shortcuts / scripts (create reminders from your phone)"
options:
  log_level: info
schema:
  log_level: list(debug|info|warning)
