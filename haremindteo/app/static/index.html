<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HARemindTeo</title>
<link rel="stylesheet" href="static/common.css">
</head>
<body>
<div class="bar"><span class="ibtn" id="barIcon"></span><h1>HARemindTeo</h1><small class="hint" id="tag" style="margin-right:12px"></small></div>
<main>
<div class="tabs" id="tabs"></div>

<div class="view" id="v-rem">
  <div class="card">
    <div class="sec" id="tAdd"></div>
    <input type="text" id="txt" autocomplete="off">
    <div class="hint" id="prev" style="margin:6px 2px;min-height:18px"></div>
    <div class="chips" id="examples" style="margin-bottom:6px"></div>
    <div class="row" style="align-items:center">
      <label class="chk" style="margin:0"><input type="checkbox" id="oNot"> <span id="tNot"></span></label>
      <label class="chk" style="margin:0"><input type="checkbox" id="oAnn"> <span id="tAnn"></span></label>
      <label class="chk" style="margin:0"><input type="checkbox" id="oLive"> <span id="tLive"></span></label>
      <span style="flex:1"></span><button class="b" id="addBtn"></button>
    </div>
  </div>
  <div class="card"><div class="sec" id="tUp"></div><div id="upList"></div></div>
  <div class="card"><div class="sec"><span id="tHist"></span></div><div id="histList"></div></div>
</div>

<div class="view" id="v-tok">
  <div class="card">
    <div class="sec"><span id="tTok"></span><span class="sp"></span><button class="b sm" id="tokNew"></button></div>
    <div class="hint" id="tokHint" style="margin-bottom:10px"></div>
    <div id="tokForm" hidden class="card" style="background:var(--primary-background-color)">
      <label class="f" id="lTokName"></label><input type="text" id="tkName">
      <label class="f" id="lTokPh"></label><div class="chips" id="tkPhones"></div>
      <label class="f" id="lTokSp"></label><div class="chips" id="tkSpk"></div>
      <label class="chk"><input type="checkbox" id="tkAnn"> <span id="tTkAnn"></span></label>
      <label class="chk"><input type="checkbox" id="tkLive" checked> <span id="tTkLive"></span></label>
      <div class="row"><button class="b" id="tkCreate"></button><button class="b alt" id="tkCancel"></button></div>
    </div>
    <div id="tokResult"></div><div id="tokList"></div>
  </div>
</div>

<div class="view" id="v-set">
  <div class="card">
    <div class="sec" id="sDef"></div>
    <label class="f" id="lPhones"></label><div class="chips" id="phones"></div>
    <label class="f" id="lSpk"></label><div class="chips" id="spk"></div>
    <div class="row"><div class="grow"><label class="f" id="lTts"></label><select id="tts"></select></div><div class="grow"><label class="f" id="lLang"></label><input type="text" id="lang" placeholder="pl, en"></div></div>
    <label class="chk"><input type="checkbox" id="dNot"> <span id="tdNot"></span></label>
    <label class="chk"><input type="checkbox" id="dAnn"> <span id="tdAnn"></span></label>
    <label class="chk"><input type="checkbox" id="dLive"> <span id="tdLive"></span></label>
    <div class="row"><div class="grow"><label class="f" id="lSnz"></label><input type="number" id="snz" min="1"></div><div class="grow"><label class="f" id="lKeep"></label><input type="number" id="keep" min="1"></div></div>
    <div class="row"><button class="b" id="saveBtn"></button><button class="b alt" id="testBtn"></button></div>
  </div>
  <div class="card"><div class="sec" id="sHow"></div><div class="hint" id="howTxt"></div></div>
</div>

<footer><span id="by"></span> <a href="https://teodorteo.com" target="_blank" rel="noopener">TeodorTeo.com</a></footer>
</main>
<script src="static/common.js"></script>
<script src="static/icons.js"></script>
<script>
const tr = HL.tr, esc = HL.esc, $ = id => document.getElementById(id);
let S = null, off = 0, parseT;
$("barIcon").innerHTML = HL.icon("mdi:alarm"); $("tag").textContent = tr("Przypomnienia i timery","Reminders and timers"); $("by").textContent = tr("Stworzone przez","Created by");
[["rem",tr("Przypomnienia","Reminders")],["tok",tr("Skróty (tokeny)","Shortcuts (tokens)")],["set",tr("Ustawienia","Settings")]].forEach(([id, l]) => { const b = document.createElement("button"); b.textContent = l; b.dataset.id = id; b.onclick = () => show(id); $("tabs").append(b); });
function show(id){ document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === id)); document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + id));
  if(id === "set") fillSettings(); if(id === "tok") renderTokens(); }
const T = {tAdd:tr("Nowe przypomnienie – napisz po ludzku","New reminder – just type it"), txt:tr("np. za 15 min wyjmij pranie · jutro o 7:45 siłownia · codziennie o 8:00 leki","e.g. in 15 min take out laundry · tomorrow at 7:45 gym · every day at 8:00 pills"),
  tNot:tr("🔔 Powiadomienie","🔔 Notification"), tAnn:tr("📣 Głos na głośniku","📣 Spoken"), tLive:tr("🏝️ Odliczanie na wyspie","🏝️ Island countdown"), add:tr("Dodaj","Add"), tUp:tr("Nadchodzące","Upcoming"), tHist:tr("Historia","History"),
  tTok:tr("Tokeny dla Skrótów","Tokens for Shortcuts"), tokNew:tr("+ Nowy token","+ New token"), tokHint:tr("Token pozwala skrótowi iPhone'a dodawać przypomnienia głosem lub tekstem („Hej Siri, przypomnij…”). Widzi i może anulować tylko własne przypomnienia.","A token lets an iPhone shortcut add reminders by voice or text (“Hey Siri, remind…”). It can only see and cancel its own reminders."),
  lTokName:tr("Nazwa","Name"), lTokPh:tr("Telefony (powiadomienia i wyspa)","Phones (notifications and island)"), lTokSp:tr("Głośniki","Speakers"), tTkAnn:tr("Mów przypomnienia na głośnikach","Speak reminders on the speakers"), tTkLive:tr("Odliczanie na Dynamic Island","Dynamic Island countdown"), tkCreate:tr("Utwórz token","Create token"), cancel:tr("Anuluj","Cancel"),
  sDef:tr("Domyślne ustawienia","Defaults"), lPhones:tr("Telefony (aplikacja Companion)","Phones (Companion app)"), lSpk:tr("Głośniki do ogłaszania","Speakers for spoken reminders"), lTts:tr("Silnik TTS","TTS engine"), lLang:tr("Język (opcjonalnie)","Language (optional)"),
  tdNot:tr("Powiadomienie z przyciskami Gotowe / Drzemka","Notification with Done / Snooze buttons"), tdAnn:tr("Głos na głośnikach","Spoken on speakers"), tdLive:tr("Odliczanie na Dynamic Island (iOS 17.2+, Core 2026.7+)","Dynamic Island countdown (iOS 17.2+, Core 2026.7+)"),
  lSnz:tr("Drzemka (minuty)","Snooze (minutes)"), lKeep:tr("Trzymaj historię (dni)","Keep history (days)"), save:tr("Zapisz","Save"), test:tr("Wyślij test","Send test"), sHow:tr("Jak pisać przypomnienia","How to write reminders"),
  howTxt:tr("Czas względny: „za 15 min”, „za 1h 30m”, „za pół godziny”. Godzina: „o 18:30”, „o 7”, „at 6pm”. Dzień: „jutro”, „pojutrze”, „w poniedziałek”. Powtarzanie: „codziennie o 7:30”, „w dni robocze o 8:15”, „co tydzień w piątek o 17:00”, „co 2 godziny”. Reszta zdania to treść. Zdarzenie HA po odpaleniu: haremindteo_fired; sensory: sensor.haremindteo_next i sensor.haremindteo_pending.",
    "Relative: “in 15 min”, “in 1h 30m”, “in half an hour”. Time: “at 18:30”, “at 7”, “at 6pm”. Day: “tomorrow”, “on Monday”. Repeats: “every day at 7:30”, “every weekday at 8:15”, “every week on Friday at 17:00”, “every 2 hours”. The rest is the message. HA event when fired: haremindteo_fired; sensors: sensor.haremindteo_next and sensor.haremindteo_pending.")};
for(const k of ["tAdd","tNot","tAnn","tLive","tUp","tHist","tTok","tokHint","lTokName","lTokPh","lTokSp","tTkAnn","tTkLive","sDef","lPhones","lSpk","lTts","lLang","tdNot","tdAnn","tdLive","lSnz","lKeep","sHow"]) $(k).textContent = T[k];
$("txt").placeholder = T.txt; $("addBtn").textContent = T.add; $("tokNew").textContent = T.tokNew; $("tkCreate").textContent = T.tkCreate; $("tkCancel").textContent = T.cancel; $("saveBtn").textContent = T.save; $("testBtn").textContent = T.test; $("howTxt").textContent = T.howTxt;
const EX = HL.lang === "pl" ? ["za 15 min wyjmij pranie","jutro o 7:45 siłownia","codziennie o 8:00 leki","w piątek o 17:00 zakupy","co 2 godziny wypij wodę"] : ["in 15 min take out laundry","tomorrow at 7:45 gym","every day at 8:00 pills","on Friday at 17:00 shopping","every 2 hours drink water"];
EX.forEach(x => { const c = document.createElement("label"); c.style.cursor = "pointer"; c.textContent = x; c.onclick = () => { $("txt").value = x; parse(); }; $("examples").append(c); });

function chipset(box, items, sel, label){ box.innerHTML = ""; if(!items.length){ box.innerHTML = `<span class="hint">—</span>`; return; }
  items.forEach(it => { const id = it.id || it, l = document.createElement("label"); l.innerHTML = `<input type="checkbox" value="${esc(id)}" ${sel.includes(id) ? "checked" : ""}> ${esc(it.name || it)}`; box.append(l); }); }
const vals = box => [...box.querySelectorAll("input:checked")].map(i => i.value);

async function load(){
  try{ S = await HL.api("state"); }catch(e){ return HL.toast(e.message, true); }
  off = S.now - Date.now()/1000; render();
}
const RPT = r => !r ? "" : ({daily:tr("codziennie","daily"), weekly:tr("co tydzień","weekly"), weekdays:tr("w dni robocze","weekdays"), interval:tr("co ","every ") + (r.every >= 3600 ? Math.round(r.every/360)/10 + " h" : Math.round(r.every/60) + " min")}[r.type]);
function fmtLeft(sec){ if(sec <= 0) return "0:00"; const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = Math.floor(sec%60);
  if(sec >= 86400) return Math.floor(sec/86400) + tr(" d "," d ") + Math.floor(sec%86400/3600) + " h"; return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); }
function render(){
  if(!S) return;
  const pend = S.reminders.filter(r => r.state === "pending"), hist = S.reminders.filter(r => r.state !== "pending");
  const mk = (r, pending) => { const el = document.createElement("div"); el.className = "item";
    const col = pending ? "var(--warning-color)" : r.state === "fired" ? "var(--success-color)" : "var(--secondary-text-color)";
    el.innerHTML = `<div class="shape" style="color:${col};background:color-mix(in srgb,${col} 20%,transparent)">${HL.icon(pending ? "mdi:alarm" : r.state === "cancelled" ? "mdi:cancel" : "mdi:check-circle")}</div>
      <div class="n"><b></b><div class="hint"></div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px"></div></div>${pending ? '<span class="cd" style="font-size:20px;font-weight:500;min-width:64px;text-align:right"></span>' : ""}
      ${pending ? `<button class="b alt sm sn">+${S.settings.snooze_minutes} min</button><button class="b alt sm cn">${tr("Anuluj","Cancel")}</button>` : `<button class="b alt sm dl">${tr("Usuń","Delete")}</button>`}`;
    el.querySelector("b").textContent = r.title || r.message; el.querySelector(".hint").textContent = r.due_text + (r.message && r.message !== r.title ? " · " + r.message : "");
    const bd = el.querySelector("div[style*=flex]"); const add = (t, c) => { const s = document.createElement("span"); s.className = "badge " + (c || ""); s.textContent = t; bd.append(s); };
    if(r.repeat) add("🔁 " + RPT(r.repeat)); if(r.notify) add("🔔"); if(r.announce) add("📣"); if(r.live) add("🏝️"); if(r.snoozed) add(tr("drzemka ","snoozed ") + r.snoozed); if(r.created_by !== "panel") add("📱 " + r.created_by);
    if(pending){ el.dataset.due = r.due; el.querySelector(".sn").onclick = async () => { try{ await HL.post(`reminders/${r.id}/snooze`); load(); }catch(e){ HL.toast(e.message, true); } };
      el.querySelector(".cn").onclick = async () => { try{ await HL.post(`reminders/${r.id}/cancel`); load(); }catch(e){ HL.toast(e.message, true); } }; }
    else el.querySelector(".dl").onclick = async () => { try{ await HL.api("reminders/" + r.id, {method:"DELETE"}); load(); }catch(e){ HL.toast(e.message, true); } };
    return el; };
  $("upList").innerHTML = pend.length ? "" : `<div class="hint">${tr("Brak nadchodzących przypomnień.","Nothing upcoming.")}</div>`; pend.forEach(r => $("upList").append(mk(r, true)));
  $("histList").innerHTML = hist.length ? "" : `<div class="hint">${tr("Pusto.","Empty.")}</div>`; hist.slice(0, 30).forEach(r => $("histList").append(mk(r, false)));
  tick();
}
function tick(){ const now = Date.now()/1000 + off; document.querySelectorAll("#upList .item").forEach(el => { const left = el.dataset.due - now; el.querySelector(".cd").textContent = fmtLeft(left); if(left < -2 && !el.dataset.stale){ el.dataset.stale = 1; setTimeout(load, 1200); } }); }
setInterval(tick, 500); setInterval(() => { if(!document.hidden) load(); }, 20000);

function parse(){ clearTimeout(parseT); parseT = setTimeout(async () => { const t = $("txt").value.trim(); if(!t){ $("prev").textContent = ""; return; }
  try{ const r = await HL.post("parse", {text:t}); $("prev").style.color = r.error ? "var(--error-color)" : "var(--secondary-text-color)";
    $("prev").textContent = r.error ? "⚠ " + r.error : `→ ${r.due_text} · „${r.title}”` + (r.repeat ? " · 🔁 " + RPT(r.repeat) : ""); }catch(e){ $("prev").textContent = e.message; } }, 250); }
$("txt").oninput = parse; $("txt").onkeydown = e => { if(e.key === "Enter") $("addBtn").click(); };
$("addBtn").onclick = async () => { const t = $("txt").value.trim(); if(!t) return;
  try{ await HL.post("reminders", {text:t, notify:$("oNot").checked, announce:$("oAnn").checked, live:$("oLive").checked}); $("txt").value = ""; $("prev").textContent = ""; HL.toast(tr("Dodano ✓","Added ✓")); load(); }catch(e){ HL.toast(e.message, true); } };

function fillSettings(){
  if(!S) return; const c = S.settings;
  chipset($("phones"), S.notify, c.phones); chipset($("spk"), S.speakers, c.speakers);
  $("tts").innerHTML = `<option value="">${tr("(pierwszy dostępny)","(first available)")}</option>` + S.tts.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join(""); $("tts").value = c.tts_entity; $("lang").value = c.language;
  $("dNot").checked = c.notify; $("dAnn").checked = c.announce; $("dLive").checked = c.live; $("snz").value = c.snooze_minutes; $("keep").value = c.keep_done_days;
}
const setBody = () => ({phones:vals($("phones")), speakers:vals($("spk")), tts_entity:$("tts").value, language:$("lang").value.trim(), notify:$("dNot").checked, announce:$("dAnn").checked, live:$("dLive").checked, snooze_minutes:$("snz").value, keep_done_days:$("keep").value});
$("saveBtn").onclick = async () => { try{ await HL.post("settings", setBody()); HL.toast(tr("Zapisano ✓","Saved ✓")); await load(); syncOpts(); }catch(e){ HL.toast(e.message, true); } };
$("testBtn").onclick = async () => { try{ await HL.post("settings", setBody()); await HL.post("test"); HL.toast(tr("Test wysłany","Test sent")); }catch(e){ HL.toast(e.message, true); } };
function syncOpts(){ if(!S) return; $("oNot").checked = S.settings.notify; $("oAnn").checked = S.settings.announce; $("oLive").checked = S.settings.live; }

function renderTokens(){
  if(!S) return; const box = $("tokList"); box.innerHTML = S.tokens.length ? "" : `<div class="hint">${tr("Brak tokenów.","No tokens yet.")}</div>`;
  S.tokens.forEach(k => { const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `<div class="n"><b></b> <small class="hint">${esc(k.prefix)}…</small><div class="hint"></div></div><button class="b red sm">${tr("Odwołaj","Revoke")}</button>`;
    el.querySelector("b").textContent = k.name; el.querySelector(".hint:last-child").textContent = tr("ostatnio użyty: ","last used: ") + (k.last_used ? new Date(k.last_used * 1000).toLocaleString() : tr("nigdy","never"));
    el.querySelector("button").onclick = async () => { if(!confirm(tr("Odwołać token?","Revoke this token?"))) return; try{ await HL.api("tokens/" + k.id, {method:"DELETE"}); await load(); renderTokens(); }catch(e){ HL.toast(e.message, true); } };
    box.append(el); });
}
$("tokNew").onclick = () => { $("tokForm").hidden = !$("tokForm").hidden; chipset($("tkPhones"), S.notify, S.settings.phones); chipset($("tkSpk"), S.speakers, S.settings.speakers); };
$("tkCancel").onclick = () => { $("tokForm").hidden = true; };
$("tkCreate").onclick = async () => { const name = $("tkName").value.trim(); if(!name) return HL.toast(tr("Wpisz nazwę","Enter a name"), true);
  try{ const r = await HL.post("tokens", {name, phones:vals($("tkPhones")), speakers:vals($("tkSpk")), announce:$("tkAnn").checked, live:$("tkLive").checked});
    $("tokForm").hidden = true; $("tkName").value = ""; const box = $("tokResult"); box.innerHTML = "";
    const c = document.createElement("div"); c.className = "card"; c.style.borderColor = "var(--warning-color)";
    c.innerHTML = `<b>⚠ ${tr("Skopiuj teraz – token pokazuje się tylko raz!","Copy now – the token is shown only once!")}</b><div class="hint" style="margin:6px 0">${tr("Skróty → + → „Zapytaj o dane wejściowe” (lub „Dyktuj tekst”) → „Pobierz zawartość URL”: wklej adres, metoda POST, dwa nagłówki, treść JSON z polem text = wynik poprzedniej akcji. Potem „Hej Siri, <nazwa skrótu>”.","Shortcuts → + → “Ask for Input” (or “Dictate Text”) → “Get Contents of URL”: paste the URL, method POST, the two headers, JSON body with field text = the previous result. Then “Hey Siri, <shortcut name>”.")}</div>`;
    c.append(HL.copyRow("Token", r.token), HL.copyRow("URL", `http://${location.hostname}:${S.public_port}/api/remind`), HL.copyRow("Header Authorization", "Bearer " + r.token), HL.copyRow("Header Content-Type", "application/json"), HL.copyRow(tr("Treść JSON","JSON body"), JSON.stringify({text: tr("za 15 min herbata","in 15 min tea")})));
    box.append(c); c.scrollIntoView({behavior:"smooth"}); await load(); renderTokens(); }catch(e){ HL.toast(e.message, true); } };

show("rem"); load().then(syncOpts);
</script>
</body>
</html>
