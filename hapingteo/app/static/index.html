<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAPingTeo</title>
<link rel="stylesheet" href="static/common.css">
<style>
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.mon{cursor:pointer;display:block;padding:12px}
.mon .top{display:flex;gap:10px;align-items:center}.mon .big{font-size:22px;font-weight:500;line-height:26px}
.ticks{display:flex;gap:1px;height:18px;margin-top:10px;align-items:stretch}.ticks i{flex:1;min-width:2px;border-radius:1px;background:var(--success-color)}.ticks i.bad{background:var(--error-color)}.ticks i.none{background:var(--divider-color)}
.spark{width:100%;height:34px;margin-top:6px}.spark polyline{fill:none;stroke:var(--primary-color);stroke-width:1.5}
.dim{opacity:.55}
</style>
</head>
<body>
<div class="bar"><span class="ibtn" id="barIcon"></span><h1>HAPingTeo</h1><small class="hint" id="tag" style="margin-right:12px"></small></div>
<main>
<div class="tabs" id="tabs"></div>

<div class="view" id="v-mon">
  <div class="tiles" id="tiles"></div>
  <div class="row" style="margin:0 0 12px"><button class="b" id="addBtn"></button><button class="b alt" id="presetBtn"></button></div>
  <div id="presetBox" hidden class="card" style="padding:12px">
    <div class="hint" id="presetHint" style="margin-bottom:8px"></div>
    <div class="row" style="margin-top:0"><button class="b alt sm" data-p="internet"></button><button class="b alt sm" data-p="router"></button><button class="b alt sm" data-p="ha"></button></div>
  </div>
  <div class="mons" id="mons"></div>
  <div class="hint" id="empty" hidden style="padding:24px 0;text-align:center"></div>
</div>

<div class="view" id="v-set">
  <div class="card">
    <div class="sec" id="sNot"></div>
    <label class="f" id="lPhones"></label><div class="chips" id="phones"></div>
    <label class="chk"><input type="checkbox" id="nDown"> <span id="tDown"></span></label>
    <label class="chk"><input type="checkbox" id="nUp"> <span id="tUp"></span></label>
    <label class="chk"><input type="checkbox" id="sSen"> <span id="tSen"></span></label>
    <div class="hint" id="senHint"></div>
    <div class="row"><button class="b" id="saveBtn"></button><button class="b alt" id="testBtn"></button></div>
  </div>
  <div class="card"><div class="sec" id="sAbout"></div><div class="hint" id="aboutTxt"></div></div>
</div>

<footer><span id="by"></span> <a href="https://teodorteo.com" target="_blank" rel="noopener">TeodorTeo.com</a></footer>
</main>

<dialog class="hd" id="dlg"><div class="hd-card" id="dlgBody"></div></dialog>
<script src="static/common.js"></script>
<script src="static/icons.js"></script>
<script>
const tr = HL.tr, esc = HL.esc, $ = id => document.getElementById(id);
let S = null;
$("barIcon").innerHTML = HL.icon("mdi:lan-connect"); $("tag").textContent = tr("Monitor dostępności i opóźnień","Uptime and latency monitor"); $("by").textContent = tr("Stworzone przez","Created by");
[["mon",tr("Monitory","Monitors")],["set",tr("Ustawienia","Settings")]].forEach(([id, l]) => { const b = document.createElement("button"); b.textContent = l; b.dataset.id = id; b.onclick = () => show(id); $("tabs").append(b); });
function show(id){ document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === id)); document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + id)); if(id === "set") fillSettings(); }
const T = {add:tr("+ Nowy monitor","+ New monitor"), presets:tr("Gotowe zestawy","Presets"), presetHint:tr("Dodaje gotowe monitory (istniejące są pomijane).","Adds ready-made monitors (existing ones are skipped)."),
  internet:tr("Internet (1.1.1.1, 8.8.8.8, DNS, WWW)","Internet (1.1.1.1, 8.8.8.8, DNS, web)"), router:tr("Router (brama domyślna)","Router (default gateway)"), ha:"Home Assistant",
  empty:tr("Brak monitorów. Dodaj własny albo użyj gotowego zestawu „Internet”.","No monitors yet. Add your own or use the “Internet” preset."),
  sNot:tr("Powiadomienia i sensory","Notifications and sensors"), lPhones:tr("Telefony (aplikacja Companion)","Phones (Companion app)"), tDown:tr("Powiadom, gdy coś przestanie odpowiadać","Notify when something stops responding"), tUp:tr("Powiadom, gdy znów odpowiada","Notify when it responds again"),
  tSen:tr("Publikuj sensory w Home Assistant","Publish sensors in Home Assistant"), senHint:tr("binary_sensor.hapingteo_<nazwa> (łączność), sensor.hapingteo_<nazwa>_latency (ms), sensor.hapingteo_status i binary_sensor.hapingteo_problem.","binary_sensor.hapingteo_<name> (connectivity), sensor.hapingteo_<name>_latency (ms), sensor.hapingteo_status and binary_sensor.hapingteo_problem."),
  save:tr("Zapisz","Save"), test:tr("Wyślij test","Send test"), sAbout:tr("Jak to działa","How it works"),
  about:tr("Typy: ping (ICMP), TCP (host:port), HTTP (kod odpowiedzi + opcjonalne słowo na stronie), DNS (rozwiązywanie nazwy). Monitor jest „down” po zadanej liczbie kolejnych niepowodzeń (ponowienia), żeby jedna zgubiona paczka nie budziła alarmu. Historia z ostatnich 48 h jest zapisywana.","Types: ping (ICMP), TCP (host:port), HTTP (status code + optional keyword on the page), DNS (name resolution). A monitor is “down” after the set number of consecutive failures (retries) so a single lost packet does not raise an alarm. The last 48 h of history is kept.")};
$("addBtn").textContent = T.add; $("presetBtn").textContent = T.presets; $("presetHint").textContent = T.presetHint; $("empty").textContent = T.empty;
[["internet"],["router"],["ha"]].forEach(([k]) => document.querySelector(`[data-p=${k}]`).textContent = T[k]);
for(const k of ["sNot","lPhones","tDown","tUp","tSen","senHint","sAbout"]) $(k).textContent = T[k]; $("saveBtn").textContent = T.save; $("testBtn").textContent = T.test; $("aboutTxt").textContent = T.about;

const COL = {up:"var(--success-color)", down:"var(--error-color)", unknown:"var(--disabled-text-color)", paused:"var(--disabled-text-color)"};
const TYPES = {ping:"Ping", tcp:"TCP", http:"HTTP", dns:"DNS"};
const ICON = {ping:"mdi:pulse", tcp:"mdi:lan-connect", http:"mdi:web", dns:"mdi:dns"};
const fmtMs = v => v == null ? "—" : (v < 10 ? v.toFixed(1) : Math.round(v)) + " ms";
function spark(points){ const v = points.filter(p => p[2] != null).map(p => p[2]); if(v.length < 2) return ""; const max = Math.max(...v, 1), n = v.length;
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline vector-effect="non-scaling-stroke" points="${v.map((x, i) => (i / (n - 1) * 100).toFixed(1) + "," + (28 - x / max * 26).toFixed(1)).join(" ")}"/></svg>`; }
function ticks(points, n = 60){ const last = points.slice(-n); let h = ""; for(let i = 0; i < n - last.length; i++) h += `<i class="none"></i>`; last.forEach(p => h += `<i class="${p[1] ? "" : "bad"}" title="${new Date(p[0]*1000).toLocaleTimeString()} ${p[1] ? fmtMs(p[2]) : "✗"}"></i>`); return `<div class="ticks">${h}</div>`; }

async function load(){
  try{ S = await HL.api("state"); }catch(e){ return HL.toast(e.message, true); } render();
}
function render(){
  const sm = S.summary, ok = sm.total > 0 && sm.down === 0;
  const tiles = [[sm.total ? (ok ? tr("Wszystko działa","All up") : sm.down + " " + tr("nie działa","down")) : "—", tr("Status","Status"), ok ? "mdi:check-circle" : "mdi:alert-circle", ok ? "var(--success-color)" : sm.total ? "var(--error-color)" : "var(--disabled-text-color)"],
    [sm.uptime != null ? sm.uptime + "%" : "—", tr("Dostępność 24 h","Uptime 24 h"), "mdi:heart-pulse", "var(--primary-color)"], [sm.avg != null ? fmtMs(sm.avg) : "—", tr("Średnie opóźnienie","Avg latency"), "mdi:speedometer", "var(--primary-color)"], [sm.total, tr("Monitory","Monitors"), "mdi:lan", "var(--primary-color)"]];
  $("tiles").innerHTML = ""; tiles.forEach(([big, lab, ic, col]) => { const t = document.createElement("div"); t.className = "tile"; t.style.cursor = "default";
    t.innerHTML = `<div style="width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:${col};background:color-mix(in srgb,${col} 20%,transparent);flex:none" class="hd">${HL.icon(ic)}</div><div><div class="big" style="font-size:20px">${esc(big)}</div><div class="hint">${esc(lab)}</div></div>`; $("tiles").append(t); });
  const box = $("mons"); box.innerHTML = ""; $("empty").hidden = S.monitors.length > 0;
  S.monitors.forEach(m => { const el = document.createElement("div"); el.className = "tile mon" + (m.status === "paused" ? " dim" : ""); const last = m.recent[m.recent.length - 1], col = COL[m.status];
    el.innerHTML = `<div class="top"><div style="width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:${col};background:color-mix(in srgb,${col} 20%,transparent);flex:none" class="hd">${HL.icon(ICON[m.type])}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" class="nm"></div><div class="hint tg" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>
      <div style="text-align:right"><div class="big">${m.status === "down" ? "✗" : fmtMs(last && last[2])}</div><div class="hint">${m.stats24.uptime != null ? m.stats24.uptime + "%" : "—"}</div></div></div>${spark(m.recent)}${ticks(m.recent)}`;
    el.querySelector(".nm").textContent = m.name; el.querySelector(".tg").textContent = TYPES[m.type] + " · " + m.target + (m.type === "tcp" ? ":" + m.port : "") + (m.status === "down" && m.error ? " · " + m.error : "");
    el.onclick = () => detail(m.id); box.append(el); });
}
setInterval(() => { if(!document.hidden && $("v-mon").classList.contains("on")) load(); }, 10000);

function dialog(html){ $("dlgBody").innerHTML = html; if(!$("dlg").open) $("dlg").showModal(); return $("dlgBody"); }
async function detail(id){
  const m = S.monitors.find(x => x.id === id); let h; try{ h = await HL.api(`history/${id}?hours=24`); }catch(e){ return HL.toast(e.message, true); }
  const st = h.stats, col = COL[m.status];
  const b = dialog(`<h2></h2><div class="hint tg"></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin:14px 0"><div><div class="hint">${tr("Status","Status")}</div><b style="color:${col}">${esc(m.status)}</b> <span class="hint">${tr("od","for")} ${HL.ago(m.since)}</span></div>
    <div><div class="hint">${tr("Dostępność 24 h","Uptime 24 h")}</div><b>${st.uptime != null ? st.uptime + "%" : "—"}</b></div><div><div class="hint">${tr("Opóźnienie śr./min/max","Latency avg/min/max")}</div><b>${fmtMs(st.avg)} / ${fmtMs(st.min)} / ${fmtMs(st.max)}</b></div><div><div class="hint">p95</div><b>${fmtMs(st.p95)}</b></div><div><div class="hint">${tr("Sprawdzeń","Checks")}</div><b>${st.checks}</b></div></div>
    ${spark(h.points.slice(-300))}${ticks(h.points, 120)}<div class="hint" style="margin-top:6px">${tr("Ostatnie 24 h (najnowsze po prawej).","Last 24 h (newest on the right).")}</div>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="b red sm" id="dDel">${tr("Usuń","Delete")}</button><button class="b alt sm" id="dEdit">${tr("Edytuj","Edit")}</button><button class="b alt sm" id="dChk">${tr("Sprawdź teraz","Check now")}</button><button class="b" id="dClose">${tr("Zamknij","Close")}</button></div>`);
  b.querySelector("h2").textContent = m.name; b.querySelector(".tg").textContent = TYPES[m.type] + " · " + m.target + (m.error ? " · " + m.error : "");
  $("dClose").onclick = () => $("dlg").close(); $("dEdit").onclick = () => form(m);
  $("dChk").onclick = async () => { try{ const r = await HL.post(`monitors/${id}/check`); HL.toast(r.ok ? "✓ " + fmtMs(r.ms) : "✗ " + r.error, !r.ok); await load(); detail(id); }catch(e){ HL.toast(e.message, true); } };
  $("dDel").onclick = async () => { if(!confirm(tr("Usunąć monitor?","Delete this monitor?"))) return; try{ await HL.api("monitors/" + id, {method:"DELETE"}); $("dlg").close(); load(); }catch(e){ HL.toast(e.message, true); } };
}
function form(m){
  const A = m || {type:"ping", name:"", target:"", port:443, interval:60, timeout:5, retries:2, expect_status:0, keyword:"", verify_ssl:true, enabled:true, notify:true};
  const b = dialog(`<h2>${m ? tr("Edytuj monitor","Edit monitor") : tr("Nowy monitor","New monitor")}</h2>
    <div class="row" style="margin-top:0"><div class="grow"><label class="f">${tr("Nazwa","Name")}</label><input type="text" id="fName"></div><div class="grow"><label class="f">${tr("Typ","Type")}</label><select id="fType">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div></div>
    <label class="f" id="fTL"></label><input type="text" id="fTarget">
    <div id="fExtra"></div>
    <div class="row"><div class="grow"><label class="f">${tr("Co ile sekund","Every (seconds)")}</label><input type="number" id="fInt" min="10"></div><div class="grow"><label class="f">${tr("Limit czasu (s)","Timeout (s)")}</label><input type="number" id="fTo" min="1"></div><div class="grow"><label class="f">${tr("Ponowienia do „down”","Retries before “down”")}</label><input type="number" id="fRet" min="1"></div></div>
    <label class="chk"><input type="checkbox" id="fOn"> ${tr("Włączony","Enabled")}</label><label class="chk"><input type="checkbox" id="fNot"> ${tr("Powiadamiaj o tym monitorze","Notify about this monitor")}</label>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="b alt" id="fCancel">${tr("Anuluj","Cancel")}</button><button class="b" id="fSave">${tr("Zapisz","Save")}</button></div>`);
  $("fName").value = A.name; $("fType").value = A.type; $("fTarget").value = A.target; $("fInt").value = A.interval; $("fTo").value = A.timeout; $("fRet").value = A.retries; $("fOn").checked = A.enabled; $("fNot").checked = A.notify;
  const extra = () => { const t = $("fType").value;
    $("fTL").textContent = t === "http" ? "URL" : tr("Host lub adres IP","Host or IP address"); $("fTarget").placeholder = t === "http" ? "https://example.com" : "1.1.1.1 / nas.local";
    $("fExtra").innerHTML = t === "tcp" ? `<label class="f">${tr("Port","Port")}</label><input type="number" id="fPort" min="1" max="65535" value="${A.port}">`
      : t === "http" ? `<div class="row"><div class="grow"><label class="f">${tr("Oczekiwany kod (0 = dowolny poniżej 400)","Expected status (0 = any below 400)")}</label><input type="number" id="fExp" value="${A.expect_status}"></div><div class="grow"><label class="f">${tr("Słowo na stronie (opcjonalnie)","Keyword on the page (optional)")}</label><input type="text" id="fKey" value="${esc(A.keyword)}"></div></div><label class="chk"><input type="checkbox" id="fSsl" ${A.verify_ssl ? "checked" : ""}> ${tr("Weryfikuj certyfikat SSL","Verify the SSL certificate")}</label>` : ""; };
  $("fType").onchange = extra; extra();
  $("fCancel").onclick = () => $("dlg").close();
  $("fSave").onclick = async () => { const t = $("fType").value;
    const body = {id:A.id, name:$("fName").value, type:t, target:$("fTarget").value.trim(), interval:$("fInt").value, timeout:$("fTo").value, retries:$("fRet").value, enabled:$("fOn").checked, notify:$("fNot").checked};
    if(t === "tcp") body.port = $("fPort").value; if(t === "http"){ body.expect_status = $("fExp").value; body.keyword = $("fKey").value; body.verify_ssl = $("fSsl").checked; }
    try{ await HL.post("monitors", body); $("dlg").close(); HL.toast(tr("Zapisano ✓","Saved ✓")); setTimeout(load, 1500); load(); }catch(e){ HL.toast(e.message, true); } };
}
$("addBtn").onclick = () => form(null); $("presetBtn").onclick = () => { $("presetBox").hidden = !$("presetBox").hidden; };
document.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => { try{ const r = await HL.post("presets", {preset:b.dataset.p}); HL.toast(r.added.length ? tr("Dodano: ","Added: ") + r.added.join(", ") : tr("Nic nowego do dodania","Nothing new to add")); $("presetBox").hidden = true; setTimeout(load, 2500); load(); }catch(e){ HL.toast(e.message, true); } });

function fillSettings(){
  if(!S) return; const c = S.settings, box = $("phones"); box.innerHTML = ""; const all = [...new Set([...S.notify, ...c.phones])];
  if(!all.length) box.innerHTML = `<span class="hint">${tr("Nie znaleziono telefonu (notify.mobile_app_*).","No phone found (notify.mobile_app_*).")}</span>`;
  all.forEach(n => { const l = document.createElement("label"); l.innerHTML = `<input type="checkbox" value="${esc(n)}" ${c.phones.includes(n) ? "checked" : ""}> ${esc(n)}`; box.append(l); });
  $("nDown").checked = c.notify_down; $("nUp").checked = c.notify_up; $("sSen").checked = c.sensors;
}
const sBody = () => ({phones:[...document.querySelectorAll("#phones input:checked")].map(i => i.value), notify_down:$("nDown").checked, notify_up:$("nUp").checked, sensors:$("sSen").checked});
$("saveBtn").onclick = async () => { try{ await HL.post("settings", sBody()); HL.toast(tr("Zapisano ✓","Saved ✓")); load(); }catch(e){ HL.toast(e.message, true); } };
$("testBtn").onclick = async () => { try{ await HL.post("settings", sBody()); await HL.post("test"); HL.toast(tr("Test wysłany","Test sent")); }catch(e){ HL.toast(e.message, true); } };

show("mon"); load();
</script>
</body>
</html>
