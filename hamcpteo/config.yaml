name: HAMcpTeo
version: "1.0.0"
slug: hamcpteo
description: Let Claude (claude.ai / the iPhone app) read and control ONLY the entities you pick, through an MCP server on your own DDNS name over HTTPS - sign-in with your Home Assistant account and its 2FA, short-lived tokens, phone approval for risky actions. By TeodorTeo.com
url: https://teodorteo.com
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:shield-key
panel_title: Claude MCP
map:
  - ssl:ro
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: "Public HTTPS endpoint for Claude (OAuth sign-in + MCP). Forward this port on your router. Only listens when public_url and a certificate are set."
options:
  public_url: ""
  allowed_users: []
  require_mfa: true
  tls: auto
  certfile: fullchain.pem
  keyfile: privkey.pem
  ha_url: http://homeassistant:8123
  notify_service: ""
  approve_risky: true
  allowed_ips: []
  allowed_redirects:
    - https://claude.ai/api/
    - https://claude.com/api/
  log_level: info
schema:
  public_url: str?
  allowed_users:
    - str?
  require_mfa: bool
  tls: list(auto|off)
  certfile: str
  keyfile: str
  ha_url: str
  notify_service: str?
  approve_risky: bool
  allowed_ips:
    - str?
  allowed_redirects:
    - str?
  log_level: list(debug|info|warning)
