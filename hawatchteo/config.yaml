name: HAWatchTeo
version: "1.0.0"
slug: hawatchteo
description: Entity watchdog - finds unavailable, stale and low-battery entities, notifies your phone and publishes problem sensors. By TeodorTeo.com
url: https://teodorteo.com
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-search
panel_title: HAWatch
options:
  log_level: info
schema:
  log_level: list(debug|info|warning)
