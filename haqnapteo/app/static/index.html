<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAQnapTeo</title>
<link rel="stylesheet" href="static/common.css">
<style>
main{max-width:860px;margin:0 auto;padding:16px}
.big{font-size:22px;line-height:28px;font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--divider-color);flex-wrap:wrap}.li:first-child{border-top:0}
.li .n{flex:1;min-width:160px;word-break:break-all}
.pbar{height:6px;border-radius:3px;background:rgba(var(--rgb-primary-color),.2);overflow:hidden;margin-top:10px}.pbar i{display:block;height:100%;background:var(--primary-color);transition:width .3s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}.kv span:nth-child(odd){color:var(--secondary-text-color)}
</style>
</head>
<body>
<div class="bar"><span class="ibtn" id="barIcon"></span><h1>HAQnapTeo</h1><small class="hint" id="tag" style="margin-right:12px"></small></div>
<main>
<div class="tabs" id="tabs"></div>

<div class="view" id="v-cn">
  <div class="card"><div class="sec" id="cnT1"></div><div class="hint" id="cnH1"></div>
    <div class="row"><button class="b alt" id="scanBtn"></button></div><div class="row" id="scanRes" style="margin-top:6px"></div>
    <label class="f" id="lHost"></label><input type="text" id="cHost" placeholder="192.168.1.20" autocomplete="off" autocapitalize="off">
    <div class="row"><div class="grow"><label class="f" id="lUser"></label><input type="text" id="cUser" autocomplete="off" autocapitalize="off"></div>
      <div class="grow"><label class="f" id="lPass"></label><input type="password" id="cPass" autocomplete="new-password"></div></div>
    <div class="row"><div class="grow"><label class="f" id="lDom"></label><input type="text" id="cDom" autocomplete="off"></div>
      <div class="grow"><label class="f">SMB</label><select id="cVer"><option value="3">3</option><option value="2">2</option></select></div></div>
    <div class="row"><button class="b" id="shBtn"></button></div><div id="shOut" class="hint" style="margin-top:8px"></div>
    <div class="row" id="shares" style="margin-top:6px"></div>
    <div class="row"><button class="b" id="cSave" hidden></button></div>
  </div>
  <div class="card" id="cnStep3" hidden><div class="sec" id="cnT3"></div><div class="hint" id="cnH3"></div>
    <label class="f" id="lBk"></label><div class="row" style="margin-top:0"><input type="text" id="cBk" class="grow" style="flex:1"><button class="b alt sm" data-pick="cBk" id="pkBk"></button></div>
    <label class="f" id="lMd"></label><div class="row" style="margin-top:0"><input type="text" id="cMd" class="grow" style="flex:1"><button class="b alt sm" data-pick="cMd" id="pkMd"></button></div>
    <div id="picker" class="card" style="background:var(--primary-background-color);margin-top:10px" hidden><div class="hint" id="pkPath"></div><div id="pkList"></div>
      <div class="row"><button class="b sm" id="pkOk"></button><button class="b alt sm" id="pkUp"></button></div></div>
    <div class="row"><button class="b" id="cSave2"></button><button class="b alt" id="cMount"></button></div>
  </div>
  <div class="card"><div class="row" style="margin:0"><button class="b red sm" id="cReset"></button></div><div class="hint" id="cResetH" style="margin-top:8px"></div></div>
</div>

<div class="view" id="v-st">
  <div class="card" id="warn" hidden></div>
  <div class="card" id="jobCard" hidden>
    <div class="sec" id="jobTitle"></div><div id="jobStep"></div>
    <div class="pbar"><i id="jobBar" style="width:0"></i></div>
    <div class="row"><button class="b red sm" id="cancelBtn"></button></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="sec" id="sBk"></div><div class="big" id="bkWhen"></div><div class="hint" id="bkInfo"></div>
      <div class="row"><button class="b" id="runBk"></button><button class="b alt" id="runBkNew"></button></div></div>
    <div class="card"><div class="sec" id="sMd"></div><div class="big" id="mdWhen"></div><div class="hint" id="mdInfo"></div>
      <div class="row"><button class="b" id="runMd"></button></div></div>
  </div>
  <div class="card"><div class="sec" id="sConn"></div><div class="kv" id="conn"></div>
    <div class="hint" id="connHint" style="margin-top:10px"></div>
    <div class="row"><button class="b alt" id="testBtn"></button></div><div id="testOut" class="hint" style="margin-top:8px"></div></div>
  <div class="card"><div class="sec" id="sSec"></div><div class="hint" id="secTxt"></div></div>
</div>

<div class="view" id="v-rm">
  <div class="card"><div class="sec"><span id="sRm"></span><span class="sp"></span><button class="b alt sm" id="rmRefresh"></button></div>
    <div class="hint" id="rmFree" style="margin-bottom:6px"></div><div id="rmList"></div></div>
</div>

<div class="view" id="v-md">
  <div class="card"><div class="sec" id="sSrc"></div><div class="hint" id="srcTxt"></div><div class="kv" id="srcInfo" style="margin-top:10px"></div>
    <div class="row"><button class="b" id="srcOn"></button><button class="b alt" id="srcOff" hidden></button></div></div>
  <div class="card"><div class="sec" id="sMd2"></div><div class="hint" id="mdTxt"></div><div class="row"><button class="b alt" id="mdReset"></button></div></div>
</div>

<div class="view" id="v-lg"><div class="card"><div class="sec" id="sLg"></div><div id="logList"></div></div></div>

<footer><span id="by"></span> <a href="https://teodorteo.com" target="_blank" rel="noopener">TeodorTeo.com</a></footer>
</main>
<script src="static/common.js"></script>
<script src="static/icons.js"></script>
<script>
const $ = id => document.getElementById(id), tr = HL.tr;
const hs = n => { for(const u of ["B","KB","MB","GB","TB"]){ if(n < 1024 || u === "TB") return (u === "B" ? Math.round(n) : n.toFixed(1)) + " " + u; n /= 1024; } };
const dt = ts => ts ? new Date(ts * 1000).toLocaleString() : "—";
let S = null;
$("barIcon").innerHTML = HL.icon("mdi:nas"); $("tag").textContent = tr("Backup i multimedia z QNAP","QNAP backup & media"); $("by").textContent = tr("Stworzone przez","Created by");
[["cn",tr("Połączenie","Connect")],["st",tr("Status","Status")],["rm",tr("Backupy na QNAP","Backups on QNAP")],["md",tr("Multimedia","Media")],["lg",tr("Historia","History")]].forEach(([id, l]) => {
  const b = document.createElement("button"); b.textContent = l; b.dataset.id = id; b.onclick = () => show(id); $("tabs").append(b); });
function show(id){ document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === id)); document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + id)); if(id === "rm") loadRemote(); if(id === "md") loadMount(); }
show(null);
const T = {
  sBk: tr("Backup Home Assistanta","Home Assistant backup"), sMd: tr("Multimedia z QNAP","Media from QNAP"), sConn: tr("Połączenie","Connection"),
  runBk: tr("Wyślij backupy teraz","Upload backups now"), runBkNew: tr("Nowy backup + wyślij","New backup + upload"), runMd: tr("Pobierz multimedia teraz","Download media now"),
  testBtn: tr("Testuj połączenie","Test connection"), cancelBtn: tr("Anuluj","Cancel"), sRm: tr("Backupy zapisane na QNAP","Backups stored on the QNAP"), rmRefresh: tr("Odśwież","Refresh"),
  sMd2: tr("Pobieranie multimediów","Media download"), mdReset: tr("Pobierz wszystko od nowa","Re-download everything"), sLg: tr("Historia","History"), sSec: tr("Prywatność","Privacy"),
  connHint: tr("Dane logowania ustawiasz w zakładce Konfiguracja dodatku (hasło nigdy nie jest tu pokazywane).","Set credentials in the add-on Configuration tab (the password is never shown here)."),
  secTxt: tr("Ten dodatek nie otwiera żadnego portu w Twojej sieci - panel działa tylko przez Home Assistant. Łączy się wyłącznie wychodząco z Twoim QNAP po SMB. Używaj osobnego użytkownika QNAP z dostępem tylko do jednego udziału.",
             "This add-on opens no port on your network - the panel is reachable only through Home Assistant. It only connects outward to your QNAP over SMB. Use a dedicated QNAP user with access to a single share."),
  mdTxt: tr("Nowe i zmienione pliki z folderu QNAP są kopiowane do folderu media HA (jednokierunkowo, nic nie jest kasowane). Plik jest pobierany ponownie tylko, gdy zmieni się rozmiar lub data.",
            "New and changed files from the QNAP folder are copied into the HA media folder (one way, nothing is deleted). A file is downloaded again only when its size or date changes.")};
Object.assign(T, {cnT1: tr("1. Połącz z QNAP","1. Connect to the QNAP"), cnH1: tr("Znajdź QNAP w sieci albo wpisz adres, podaj użytkownika i hasło (najlepiej osobnego użytkownika z dostępem do jednego udziału) i wybierz udział.","Find the QNAP on your network or type its address, enter the user and password (ideally a dedicated user with access to one share) and pick the share."),
  scanBtn: tr("🔍 Szukaj w sieci","🔍 Scan the network"), lHost: tr("Adres (IP lub nazwa)","Address (IP or name)"), lUser: tr("Użytkownik","Username"), lPass: tr("Hasło (puste = bez zmian)","Password (empty = keep)"), lDom: tr("Domena (opcjonalnie)","Domain (optional)"),
  shBtn: tr("Połącz i pokaż udziały","Connect & list shares"), cSave: tr("Zapisz połączenie","Save connection"), cnT3: tr("2. Foldery i źródło multimediów","2. Folders and media source"), cnH3: tr("Wybierz folder na backupy i folder z multimediami, zapisz, a potem podłącz QNAP jako źródło multimediów w HA.","Choose the backup folder and the media folder, save, then mount the QNAP as a media source in HA."),
  lBk: tr("Folder backupów","Backup folder"), lMd: tr("Folder multimediów (pobieranie)","Media folder (download)"), pkBk: tr("Przeglądaj","Browse"), pkMd: tr("Przeglądaj","Browse"), pkOk: tr("Wybierz ten folder","Use this folder"), pkUp: tr("↑ Wyżej","↑ Up"),
  cSave2: tr("Zapisz foldery","Save folders"), cMount: tr("Zapisz i podłącz jako źródło multimediów","Save & mount as media source"), cReset: tr("Usuń zapisane połączenie","Forget the saved connection"),
  cResetH: tr("Dane zapisane tutaj (w prywatnym folderze dodatku) mają pierwszeństwo przed Konfiguracją dodatku.","Details saved here (in the add-on's private folder) take precedence over the add-on Configuration."),
sSrc: tr("Źródło multimediów w HA (strumieniowanie z QNAP)","Media source in HA (stream from the QNAP)"), srcOn: tr("Podłącz QNAP jako źródło multimediów","Mount QNAP as media source"), srcOff: tr("Odłącz","Remove"),
  srcTxt: tr("Montuje cały udział QNAP w HA tylko do odczytu (Supervisor, CIFS). Pojawia się w Multimediach HA i w kartach odtwarzacza bez kopiowania plików.","Mounts the whole QNAP share in HA read-only (Supervisor, CIFS). It appears in HA Media and in player cards with no file copying.")});
for(const [k, v] of Object.entries(T)) if($(k)) $(k).textContent = v;

async function refresh(){
  try{ S = await HL.api("state"); }catch(e){ return; }
  fillConn();
  const o = S.options, j = S.job;
  $("warn").hidden = S.configured;
  if(!S.configured) $("warn").innerHTML = `<div class="sec">${tr("Skonfiguruj QNAP","Set up your QNAP")}</div><div class="hint">${tr("Otwórz zakładkę Konfiguracja tego dodatku i podaj adres QNAP, nazwę udziału, użytkownika i hasło. Potem wróć tu i kliknij Testuj połączenie.","Open this add-on's Configuration tab and enter the QNAP address, share name, username and password. Then come back and press Test connection.")}</div>`;
  $("jobCard").hidden = !j.running;
  if(j.running){
    $("jobTitle").textContent = ({backup:tr("Backup w toku","Backup running"),media:tr("Pobieranie multimediów","Downloading media"),fetch:tr("Pobieranie backupu","Fetching backup")})[j.kind] || "";
    $("jobStep").textContent = j.step + (j.files_total ? ` (${j.files_done}/${j.files_total})` : "");
    $("jobBar").style.width = (j.files_total ? Math.round(100 * j.files_done / j.files_total) : 100) + "%";
  }
  [$("runBk"), $("runBkNew"), $("runMd")].forEach(b => b.disabled = j.running || !S.configured);
  $("runMd").disabled = j.running || !S.configured || !o.media_enabled;
  $("bkWhen").textContent = S.last_backup ? HL.ago(S.last_backup) : tr("jeszcze nie było","not yet");
  $("bkInfo").textContent = (S.last_backup ? dt(S.last_backup) + " · " : "") + (o.backup_enabled ? (o.backup_time ? tr("codziennie o ","daily at ") + o.backup_time : tr("tylko ręcznie","manual only")) + " · " + tr("trzymam ","keeping ") + o.backup_keep : tr("wyłączone w konfiguracji","disabled in configuration")) + " · " + tr("lokalnie: ","local: ") + S.local_backups;
  $("mdWhen").textContent = S.last_media ? HL.ago(S.last_media) : tr("jeszcze nie było","not yet");
  $("mdInfo").textContent = o.media_enabled ? (S.last_media ? dt(S.last_media) + " · " : "") + (o.media_every_hours ? tr("co ","every ") + o.media_every_hours + " h" : tr("tylko ręcznie","manual only")) + " · " + tr("śledzone pliki: ","tracked files: ") + S.media_tracked : tr("wyłączone w konfiguracji","disabled in configuration");
  const rows = [[tr("Adres","Address"), o.host || "—"], [tr("Udział","Share"), o.share || "—"], [tr("Użytkownik","User"), o.username || "—"], [tr("Hasło","Password"), o.password_set ? "••••••••" : tr("brak","not set")], ["SMB", o.smb_version],
    [tr("Folder backupów","Backup folder"), o.backup_dir], [tr("Folder multimediów","Media folder"), o.media_remote_dir + " → /media/" + o.media_local_dir]];
  $("conn").innerHTML = rows.map(([a, b]) => `<span>${HL.esc(a)}</span><span>${HL.esc(b)}</span>`).join("");
  $("mdReset").disabled = j.running;
  $("logList").innerHTML = S.history.length ? S.history.map(h => `<div class="li"><span class="badge ${h.ok ? "ok" : "err"}">${h.ok ? "OK" : tr("błąd","error")}</span><span class="badge">${HL.esc(h.kind)}</span><span class="n">${HL.esc(h.text)}</span><span class="hint">${dt(h.ts)}</span></div>`).join("") : `<div class="hint">${tr("Brak wpisów.","No entries yet.")}</div>`;
}
$("runBk").onclick = () => run("backup", false); $("runBkNew").onclick = () => run("backup", true); $("runMd").onclick = () => run("media", false);
async function run(k, create){ try{ await HL.post("run/" + k, {create}); HL.toast(tr("Start ✓","Started ✓")); refresh(); }catch(e){ HL.toast(e.message, true); } }
$("cancelBtn").onclick = async () => { await HL.post("cancel"); HL.toast(tr("Anulowanie…","Cancelling…")); };
$("testBtn").onclick = async () => {
  $("testOut").textContent = tr("Łączę…","Connecting…");
  const r = await HL.post("test");
  $("testOut").innerHTML = r.ok ? `✅ ${tr("Połączono","Connected")}${r.free != null ? " · " + tr("wolne miejsce: ","free space: ") + hs(r.free) : ""}${r.backup_dir ? " · " + tr("folder backupów: ","backup folder: ") + HL.esc(r.backup_dir) : ""}${r.media_dir ? " · " + tr("folder multimediów: ","media folder: ") + HL.esc(r.media_dir) : ""}` : "❌ " + HL.esc(r.error);
};
async function loadRemote(){
  $("rmList").innerHTML = `<div class="hint">${tr("Ładuję…","Loading…")}</div>`;
  try{
    const r = await HL.api("remote");
    $("rmFree").textContent = r.free != null ? tr("Wolne miejsce na QNAP: ","Free space on the QNAP: ") + hs(r.free) : "";
    $("rmList").innerHTML = r.items.length ? "" : `<div class="hint">${tr("Brak backupów w folderze.","No backups in the folder.")}</div>`;
    r.items.forEach(i => {
      const d = document.createElement("div"); d.className = "li";
      d.innerHTML = `<span class="n">${HL.esc(i.name)}<div class="hint">${dt(i.mtime)} · ${hs(i.size)}</div></span>${i.local ? `<span class="badge ok">${tr("jest w HA","in HA")}</span>` : `<button class="b alt sm" data-a="f">${tr("Pobierz do HA","Fetch to HA")}</button>`}<button class="b red sm" data-a="d">${tr("Usuń","Delete")}</button>`;
      const f = d.querySelector('[data-a=f]'); if(f) f.onclick = async () => { f.disabled = true; try{ await HL.post("fetch", {name:i.name}); HL.toast(tr("Skopiowano do backupów HA ✓","Copied to HA backups ✓")); loadRemote(); }catch(e){ HL.toast(e.message, true); f.disabled = false; } };
      d.querySelector('[data-a=d]').onclick = async () => { if(!confirm(tr("Usunąć z QNAP: ","Delete from the QNAP: ") + i.name + "?")) return; try{ await HL.post("delete", {name:i.name}); loadRemote(); }catch(e){ HL.toast(e.message, true); } };
      $("rmList").append(d);
    });
  }catch(e){ $("rmList").innerHTML = `<div class="hint" style="color:var(--error-color)">${HL.esc(e.message)}</div>`; }
}
async function loadMount(){
  const r = await HL.api("mount"); const m = r.mount;
  $("srcInfo").innerHTML = r.error ? `<span>${tr("Błąd","Error")}</span><span style="color:var(--error-color)">${HL.esc(r.error)}</span>` : m ? `<span>${tr("Stan","State")}</span><span>${HL.esc(m.state || "?")}</span><span>${tr("Ścieżka","Path")}</span><span>${HL.esc(r.path)}</span><span>media-source</span><span>${HL.esc(r.source)}</span>` : `<span>${tr("Stan","State")}</span><span>${tr("niepodłączone","not mounted")}</span>`;
  $("srcOff").hidden = !m; $("srcOn").textContent = m ? tr("Zaktualizuj dane logowania","Update credentials") : T.srcOn;
}
$("srcOn").onclick = async () => { try{ await HL.post("mount"); HL.toast("✓"); }catch(e){ HL.toast(e.message, true); } loadMount(); };
$("srcOff").onclick = async () => { if(!confirm(tr("Odłączyć QNAP od multimediów HA?","Remove the QNAP media source?"))) return; try{ await HL.api("mount", {method:"DELETE"}); }catch(e){ HL.toast(e.message, true); } loadMount(); };
$("rmRefresh").onclick = loadRemote;
$("mdReset").onclick = async () => { if(!confirm(tr("Następna synchronizacja pobierze wszystko od nowa. Kontynuować?","The next sync will download everything again. Continue?"))) return; await HL.post("media/reset"); HL.toast("✓"); refresh(); };

// ---- connect wizard
let cnShare = "", pickFor = null, pickPath = "";
function fillConn(){ const o = S.options; if(!$("cHost").dataset.t){ $("cHost").dataset.t = 1; $("cHost").value = o.host || ""; $("cUser").value = o.username || ""; $("cDom").value = o.domain || ""; $("cVer").value = o.smb_version || "3"; cnShare = o.share || ""; $("cBk").value = o.backup_dir || ""; $("cMd").value = o.media_remote_dir || ""; } $("cnStep3").hidden = !S.configured; if(S.configured && !$("shares").children.length) showShares([{name:o.share}]); }
const credBody = () => ({host:$("cHost").value.trim(), username:$("cUser").value.trim(), password:$("cPass").value, domain:$("cDom").value.trim(), smb_version:$("cVer").value});
function showShares(list){
  $("shares").innerHTML = ""; list.forEach(x => { const b = document.createElement("button"); b.className = "b sm " + (x.name === cnShare ? "" : "alt"); b.textContent = "📁 " + x.name + (x.comment ? " · " + x.comment : "");
    b.onclick = () => { cnShare = x.name; showShares(list); }; $("shares").append(b); });
  $("cSave").hidden = !cnShare; }
$("scanBtn").onclick = async () => { $("scanRes").innerHTML = `<span class="hint">${tr("Skanuję…","Scanning…")}</span>`;
  try{ const r = await HL.post("discover"); $("scanRes").innerHTML = r.hosts.length ? "" : `<span class="hint">${tr("Nic nie znaleziono - wpisz adres ręcznie.","Nothing found - type the address manually.")}</span>`;
    r.hosts.forEach(h => { const b = document.createElement("button"); b.className = "b alt sm"; b.textContent = h.ip + (h.qnap ? " · QNAP" : ""); b.onclick = () => { $("cHost").value = h.ip; }; $("scanRes").append(b); }); }
  catch(e){ $("scanRes").innerHTML = ""; HL.toast(e.message, true); } };
$("shBtn").onclick = async () => { $("shOut").textContent = tr("Łączę…","Connecting…");
  try{ const r = await HL.post("shares", credBody()); if(!r.ok){ $("shOut").innerHTML = "❌ " + HL.esc(r.error); return; }
    $("shOut").textContent = "✅ " + tr("Połączono. Wybierz udział:","Connected. Pick a share:"); if(!cnShare || !r.shares.some(x => x.name === cnShare)) cnShare = r.shares[0]?.name || ""; showShares(r.shares); }
  catch(e){ $("shOut").innerHTML = "❌ " + HL.esc(e.message); } };
async function saveConn(extra){ const r = await HL.post("connection", {...credBody(), share:cnShare, ...extra}); if(!r.ok) throw new Error(r.error); $("cPass").value = ""; return r; }
$("cSave").onclick = async () => { try{ await saveConn({}); HL.toast(tr("Zapisano ✓","Saved ✓")); await refresh(); $("cnStep3").hidden = false; }catch(e){ HL.toast(e.message, true); } };
$("cSave2").onclick = async () => { try{ await saveConn({backup_dir:$("cBk").value, media_remote_dir:$("cMd").value}); HL.toast(tr("Zapisano ✓","Saved ✓")); refresh(); }catch(e){ HL.toast(e.message, true); } };
$("cMount").onclick = async () => { try{ await saveConn({backup_dir:$("cBk").value, media_remote_dir:$("cMd").value}); await HL.post("mount"); HL.toast(tr("Źródło multimediów podłączone ✓","Media source mounted ✓")); refresh(); }catch(e){ HL.toast(e.message, true); } };
$("cReset").onclick = async () => { if(!confirm(tr("Zapomnieć zapisane połączenie?","Forget the saved connection?"))) return; await HL.api("connection", {method:"DELETE"}); $("cHost").dataset.t = ""; $("shares").innerHTML = ""; refresh(); };
async function browse(path){ pickPath = path; $("pkPath").textContent = "/" + path; $("pkList").innerHTML = `<div class="hint">${tr("Ładuję…","Loading…")}</div>`;
  try{ const r = await HL.api("browse?path=" + encodeURIComponent(path)); $("pkList").innerHTML = r.dirs.length ? "" : `<div class="hint">${tr("(brak podfolderów)","(no subfolders)")}</div>`;
    r.dirs.forEach(d => { const b = document.createElement("div"); b.className = "li"; b.style.cursor = "pointer"; b.textContent = "📁 " + d; b.onclick = () => browse(path ? path + "/" + d : d); $("pkList").append(b); }); }
  catch(e){ $("pkList").innerHTML = `<div class="hint" style="color:var(--error-color)">${HL.esc(e.message)}</div>`; } }
document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { pickFor = b.dataset.pick; $("picker").hidden = false; browse(""); });
$("pkOk").onclick = () => { $(pickFor).value = pickPath; $("picker").hidden = true; };
