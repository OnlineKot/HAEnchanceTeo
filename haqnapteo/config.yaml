name: HAQnapTeo
version: "1.2.0"
slug: haqnapteo
description: Back up Home Assistant to your QNAP (SMB) with retention, and download media from the QNAP into HA. Private - no network ports, panel only through Home Assistant. By TeodorTeo.com
url: https://teodorteo.com
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:nas
panel_title: QNAP
map:
  - backup:rw
  - media:rw
options:
  host: ""
  share: ""
  username: ""
  password: ""
  domain: ""
  smb_version: "3"
  backup_enabled: true
  backup_dir: HA-Backups
  backup_keep: 10
  backup_time: "03:30"
  create_backup: false
  media_enabled: false
  media_remote_dir: Multimedia
  media_local_dir: qnap
  media_every_hours: 0
  log_level: info
schema:
  host: str
  share: str
  username: str
  password: password
  domain: str?
  smb_version: list(2|3)
  backup_enabled: bool
  backup_dir: str
  backup_keep: int(1,200)
  backup_time: str?
  create_backup: bool
  media_enabled: bool
  media_remote_dir: str
  media_local_dir: str
  media_every_hours: int(0,720)
  log_level: list(debug|info|warning)
