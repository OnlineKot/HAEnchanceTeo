configuration:
  provider:
    name: AI provider
    description: claude (Anthropic) or gemini (Google). You can also switch in the panel if both keys are set.
  anthropic_api_key:
    name: Anthropic API key
    description: From console.anthropic.com. Stored by Home Assistant, never sent to the browser.
  anthropic_model:
    name: Claude model
    description: Model id used for the Anthropic Messages API (e.g. claude-sonnet-5-5).
  gemini_api_key:
    name: Gemini API key
    description: From aistudio.google.com. Stored by Home Assistant, never sent to the browser.
  gemini_model:
    name: Gemini model
    description: Model id used for generateContent (e.g. gemini-2.5-flash).
  mode:
    name: Mode
    description: read_only = the AI can only look. confirm_changes = every change (service call or config edit) needs your approval. auto = service calls on allowed domains run immediately; config edits ALWAYS need approval.
  blocked_domains:
    name: Blocked domains
    description: The AI can never call services on, or target entities of, these domains (enforced by the add-on, not by the model).
  blocked_services:
    name: Blocked services
    description: domain.service patterns that are always refused. * wildcards allowed (e.g. hassio.*).
  max_tool_rounds:
    name: Max tool rounds
    description: Upper limit of model-to-tool round trips per question.
  language:
    name: Reply language
    description: auto = the language of your message, or a code such as en, pl, de.
  log_level:
    name: Log level
    description: Verbosity of the add-on log (API keys are never logged).
