name: HAAITeo
version: "1.1.1"
slug: haaiteo
description: AI assistant panel for Home Assistant - ask Claude (Anthropic) or Gemini (Google) to understand, control and modify your smart home. Changes need your approval. Private by default - panel only through Home Assistant; optional token-protected lock-screen / Siri endpoint. By TeodorTeo.com
url: https://teodorteo.com
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-happy-outline
panel_title: AI
ports:
  8770/tcp: 8770
ports_description:
  8770/tcp: "Lock screen / Siri / Shortcuts endpoint (only listens when enabled in options; token required)"
map:
  - homeassistant_config:ro
options:
  provider: claude
  anthropic_api_key: ""
  anthropic_model: claude-sonnet-5-5
  gemini_api_key: ""
  gemini_model: gemini-2.5-flash
  mode: confirm_changes
  blocked_domains:
    - lock
    - alarm_control_panel
    - camera
    - shell_command
    - hassio
  blocked_services:
    - homeassistant.restart
    - homeassistant.stop
    - hassio.*
  max_tool_rounds: 12
  language: auto
  log_level: info
  shortcut_enabled: false
  shortcut_mode: confirm_changes
  notify_service: ""
schema:
  provider: list(claude|gemini)
  anthropic_api_key: password?
  anthropic_model: str
  gemini_api_key: password?
  gemini_model: str
  mode: list(read_only|confirm_changes|auto)
  blocked_domains:
    - str
  blocked_services:
    - str
  max_tool_rounds: int(1,30)
  language: str?
  log_level: list(debug|info|warning)
  shortcut_enabled: bool
  shortcut_mode: list(read_only|confirm_changes)
  notify_service: str?
