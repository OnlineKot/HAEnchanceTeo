<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HALiveTeo</title>
<link rel="stylesheet" href="static/common.css">
<style>
main{max-width:960px;margin:0 auto;padding:16px 16px 24px}
.tabs{display:flex;border-bottom:1px solid var(--divider-color);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--secondary-text-color);padding:0 12px;height:48px;cursor:pointer;font:500 var(--fs-2)/20px var(--ha-font);white-space:nowrap}
.tabs button:hover{color:var(--primary-text-color)}
.tabs button.on{color:var(--primary-color);border-bottom-color:var(--primary-color)}
@media (max-width:480px){.tabs button{padding:0 8px}}
.view{display:none}.view.on{display:block}
.tb{display:flex;align-items:center;gap:8px;min-height:36px;margin-bottom:8px}.sp{flex:1}
.sec{display:flex;align-items:center;gap:8px;min-height:36px;font-weight:500;color:var(--secondary-text-color)}
.sect{border-top:1px solid var(--divider-color);margin-top:24px;padding-top:8px}
details.sub{border-top:1px solid var(--divider-color);margin-top:24px}
details.sub>summary{cursor:pointer;padding:12px 0;font-weight:500;color:var(--secondary-text-color)}
details.sub>div{padding-bottom:8px}
.panel{background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:var(--r);padding:16px;margin:8px 0 16px}
.split{display:grid;grid-template-columns:minmax(0,1fr)}.split>*{min-width:0}
@media (min-width:860px){.split{grid-template-columns:minmax(0,1fr) 340px;column-gap:24px;align-items:start}.split .sticky{position:sticky;top:16px}}
button.b.ic{width:32px;padding:0;display:grid;place-items:center;color:var(--secondary-text-color)}button.b.ic svg{width:18px;height:18px}
.ipick .grid8{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;max-height:160px;overflow:auto;margin-top:8px}
.ipick .grid8 button{background:var(--input-fill-color);border:0;border-radius:var(--r);height:40px;cursor:pointer;color:var(--primary-text-color);display:grid;place-items:center}.ipick .grid8 button:hover{background:rgba(var(--rgb-primary-color),.15)}
.copy{display:flex;gap:8px;align-items:center}.copy input{flex:1}
#netInfo{min-height:40px;margin-top:16px}#netInfo .hint{display:block}
footer{text-align:center;color:var(--secondary-text-color);font-size:var(--fs-1);margin:24px 0 8px}footer a{color:var(--primary-color);text-decoration:none;font-weight:500}
.tl-n{display:flex;align-items:center;gap:8px;min-height:40px}
.bar{padding-left:max(16px,calc((100vw - 960px)/2 + 16px))}
#helpBox p{margin:0 0 8px}#helpBox .sec{margin-top:24px!important}#helpBox .sec:first-child{margin-top:0!important}
dialog details.sub{margin-top:16px}
</style>
</head>
<body>
<div class="bar"><h1>HALiveTeo</h1></div>
<main>
<div class="tabs" id="tabs"></div>

<div class="view" id="v-devices">
  <div class="tb"><span class="sp"></span><button class="b" id="newBtn"></button></div>
  <div id="newForm" class="panel" hidden>
    <div class="row" style="margin-top:0"><div class="grow"><label class="f" id="lName"></label><input type="text" id="nName"></div>
      <div class="grow"><label class="f" id="lUser"></label><input type="text" id="nUser"></div>
      <div><label class="f" id="lIcon"></label><select id="nIcon"></select></div></div>
    <div class="acts"><button class="b alt" id="nCancel"></button><button class="b" id="nCreate"></button></div>
  </div>
  <div id="created"></div>
  <div id="devList"></div>
  <div class="hint" id="devEmpty" hidden style="padding:16px 0"></div>
  <div id="netInfo"></div>
  <details class="help"><summary id="devHelpS"></summary><div class="hint" id="devHelp"></div></details>
</div>

<div class="view" id="v-edit">
  <div class="tb"><button class="b alt" id="back"></button><span class="sp"></span><span class="badge" id="dirty" hidden></span><button class="b" id="save"></button></div>
  <div class="row">
    <div class="grow"><label class="f" id="eName"></label><input type="text" id="eNameIn"></div>
    <div class="grow"><label class="f" id="eUser"></label><input type="text" id="eUserIn"></div>
  </div>
  <div class="row">
    <div class="grow"><label class="f" id="eIcon"></label><select id="eIconIn"></select></div>
    <div class="grow"><label class="f" id="eCols"></label><select id="eColsIn"></select></div>
  </div>
  <label class="chk"><input type="checkbox" id="eFeed"> <span id="eFeedT"></span></label>
  <label class="chk"><input type="checkbox" id="eOn"> <span id="eOnT"></span></label>
  <details class="sub" id="liveDet"><summary id="eLiveSec"></summary><div>
    <div class="row" style="margin-top:0"><div class="grow"><label class="f" id="ePhoneL"></label><select id="ePhone"></select></div>
      <div class="grow"><label class="f" id="eLiveL"></label><select id="eLive"></select></div></div>
    <label class="f" id="eLiveEntL"></label><input type="text" id="eLiveEnt" list="dlEnt" placeholder="sensor.pralka, sensor.auto">
    <div class="hint" id="eLiveHint" style="margin-top:4px"></div>
  </div></details>
  <div class="split">
    <section class="sect">
      <div class="tb"><span class="sec" id="tTiles"></span><span class="sp"></span>
        <button class="b alt sm" id="addAuto"></button><button class="b alt sm" id="addJson">JSON</button><button class="b alt sm" id="addTile"></button></div>
      <div id="auto" hidden></div>
      <div id="jsonBox" hidden class="panel"><textarea id="jsonTa" style="min-height:240px;font-family:monospace;font-size:12px"></textarea>
        <div class="acts" style="margin-top:8px"><button class="b alt sm" id="jsonApply"></button></div></div>
      <div id="tileList"></div>
    </section>
    <section class="sect sticky"><div class="sec" id="tPrev"></div><div class="grid inert" id="prev"></div></section>
  </div>
</div>

<div class="view" id="v-live">
  <div class="tb"><span class="sp"></span><button class="b" id="actNew"></button></div>
  <div id="actList"></div>
  <div class="hint" id="actEmpty" hidden style="padding:16px 0"></div>
  <details class="help"><summary id="liveHelpS"></summary><div class="hint" id="liveInfo"></div></details>
</div>

<div class="view" id="v-usage">
  <div class="tb"><span class="sp"></span><a class="b" id="logbookLink" href="/logbook" target="_top"></a><button class="b alt sm" id="usageClear"></button></div>
  <div id="usageList"></div>
  <details class="help"><summary id="usageHelpS"></summary><div class="hint" id="usageInfo"></div></details>
</div>

<div class="view" id="v-feed">
  <div class="tb"><span class="sp"></span><button class="b alt sm" id="feedClear"></button></div>
  <div id="feedList"></div><div class="hint" id="feedEmpty" hidden style="padding:16px 0"></div>
</div>

<div class="view" id="v-help"><div id="helpBox"></div></div>

<footer><span id="by"></span> <a href="https://teodorteo.com" target="_blank" rel="noopener">TeodorTeo.com</a></footer>
</main>
<dialog class="hd" id="tileDlg"><div class="hd-card" id="tileForm"></div></dialog>
<dialog class="hd" id="actDlg"><div class="hd-card" id="actForm"></div></dialog>
<datalist id="dlEnt"></datalist><datalist id="dlSvc"></datalist>
<div class="toast" id="toast"></div>
<script src="static/common.js"></script>
<script src="static/icons.js"></script>
<script>
const tr = HL.tr, esc = HL.esc, $ = id => document.getElementById(id);
let toastT; const toast = (m,bad)=>{const e=$("toast");e.textContent=m;e.classList.toggle("bad",!!bad);e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),3200)};
async function api(p, o = {}){
  const r = await fetch("api/admin/" + p, {...o, headers:{"Content-Type":"application/json"}});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const post = (p, b) => api(p, {method:"POST", body:JSON.stringify(b)});
const ICONS = ["cellphone","tablet","monitor","television","laptop","home","sofa","bed","silverware-fork-knife","door","car","gamepad-variant","bell","tune","speaker","lightbulb"];

// ---------- state
let B = {devices:[],entities:[],services:[],feed:[],prefix:"haliveteo",public_port:8766};
let cur = null, W = null, dirty = false, prevEls = {}, liveStates = {}, live;
$("by").textContent = tr("Stworzone przez","Created by");
$("newBtn").textContent = tr("+ Nowe urządzenie","+ New device");
$("lName").textContent = tr("Nazwa (np. Tablet w kuchni)","Name (e.g. Kitchen tablet)"); $("lIcon").textContent = tr("Ikona","Icon");
$("lUser").textContent = tr("Użytkownik (trafia do logów)","User (shown in the logs)"); $("eUser").textContent = $("lUser").textContent;
$("nCreate").textContent = tr("Utwórz","Create"); $("nCancel").textContent = tr("Anuluj","Cancel");
$("back").textContent = "← " + tr("Urządzenia","Devices"); $("save").textContent = tr("Zapisz","Save");
$("eName").textContent = tr("Nazwa","Name"); $("eIcon").textContent = tr("Ikona","Icon"); $("eCols").textContent = tr("Kolumny","Columns");
$("eFeedT").textContent = tr("Pokazuj na tym urządzeniu feed akcji na żywo","Show the live action feed on this device");
$("eOnT").textContent = tr("Urządzenie włączone","Device enabled");
$("eLiveSec").textContent = tr("Live Activities tego urządzenia","Live Activities of this device");
$("ePhoneL").textContent = tr("Telefon użytkownika (Dynamic Island)","User's phone (Dynamic Island)");
$("eLiveL").textContent = tr("Uprawnienia do Live Activities","Live Activity permissions");
$("eLive").innerHTML = `<option value="off">${tr("brak – tylko to, co da admin","none – only what the admin gives")}</option><option value="follow">${tr("może włączać/wyłączać przydzielone","can turn given ones on/off")}</option><option value="create">${tr("może tworzyć własne z dozwolonych encji","can create own from allowed entities")}</option>`;
$("eLiveEntL").textContent = tr("Dodatkowe encje dla własnych aktywności","Extra entities for own activities");
$("eLiveHint").textContent = tr("Własne aktywności: tylko encje z kafelków i z tej listy, bez szablonów HA ({state} {name} {attr.x}).","Own activities: only entities from the tiles and this list, no HA templates ({state} {name} {attr.x}).");
$("tTiles").textContent = tr("Kafelki","Tiles"); $("addTile").textContent = tr("+ Kafelek","+ Tile"); $("addAuto").textContent = tr("Z encji","From entities");
$("jsonApply").textContent = tr("Zastosuj JSON","Apply JSON"); $("tPrev").textContent = tr("Podgląd","Preview");
$("feedClear").textContent = tr("Wyczyść","Clear"); $("devHelpS").textContent = $("liveHelpS").textContent = $("usageHelpS").textContent = tr("Pomoc","Help");
[$("nIcon"), $("eIconIn")].forEach(s => s.innerHTML = ICONS.map(i => `<option value="mdi:${i}">${i}</option>`).join(""));
$("eColsIn").innerHTML = [1,2,3,4,5,6].map(i => `<option>${i}</option>`).join("");

// ---------- tabs
[["devices",tr("Urządzenia","Devices")],["live",tr("Aktywności","Activities")],["usage",tr("Użycie","Usage")],["feed",tr("Na żywo","Live")],["help",tr("Pomoc","Help")]].forEach(([id,l]) => {
  const b = document.createElement("button"); b.textContent = l; b.dataset.id = id; b.onclick = () => show(id); $("tabs").append(b);
});
function show(id){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + id));
  if(id === "feed") renderFeed(); if(id === "help") renderHelp(); if(id === "usage") renderUsage();
  if(id === "live"){ renderActs(); load().then(renderActs).catch(() => {}); }   // activities can be created from devices meanwhile
}
function showEdit(){ document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-edit")); document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on")); }

// ---------- bootstrap + live
async function load(){
  B = await api("bootstrap"); renderNet();
  $("dlEnt").innerHTML = B.entities.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("");
  $("dlSvc").innerHTML = B.services.map(s => `<option value="${esc(s)}">`).join("");
  renderDevices();
}
live = HL.live({
  onMsg: m => {
    if(m.t === "hello"){ B.feed = m.feed || B.feed; }
    else if(m.t === "states"){ liveStates = {...liveStates, ...m.states}; drawPrev(); }
    else if(m.t === "state"){ liveStates[m.e] = m.st; (prevEls[m.e] || []).forEach(([t, el]) => el.update(m.st)); }
    else if(m.t === "feed"){ B.feed.push(m.entry); B.feed = B.feed.slice(-200); if($("v-feed").classList.contains("on")) addFeed(m.entry); }
  },
  onStatus: ok => { lastWatch = null; if(ok && cur) watchPrev(); }
});

// ---------- network: local + external IP
const NT = {
  netTitle:tr("Sieć","Network"), netLocal:tr("Adres lokalny","Local address"), netExt:tr("Adres zewnętrzny","External address"), netChecked:tr("sprawdzono","checked"),
  netRefresh:tr("Odśwież","Refresh"), netErr:tr("Nie udało się sprawdzić zewnętrznego IP","Could not check the external IP"),
  netOff:tr("Sprawdzanie zewnętrznego IP jest wyłączone (opcja check_external_ip).","External IP check is off (option check_external_ip)."), netChanged:tr("IP się zmieniło","IP changed"),
  netWarn:tr("Spoza domu potrzebujesz przekierowania portu na routerze (albo VPN, np. Tailscale/WireGuard). Ten adres to zwykłe HTTP – token urządzenia można podsłuchać; lepiej użyć VPN lub reverse proxy z HTTPS.","From outside your home you need port forwarding on the router (or a VPN such as Tailscale/WireGuard). This address is plain HTTP – the device token can be read on the way; prefer a VPN or an HTTPS reverse proxy."),
  extLink:tr("Link do urządzenia (spoza domu)","Device link (from outside the home)")
};
let NET = null;
$("devHelp").innerHTML = NT.netWarn + "<br><br>" + tr("W linku zmień adres IP, jeśli urządzenie łączy się z HA pod innym adresem.","Replace the host in the link if the device reaches HA under another address.");
async function renderNet(force){
  const box = $("netInfo");
  try{ NET = force ? await post("network/refresh", {}) : await api("network"); }catch(e){ box.textContent = e.message; return; }
  const n = NET; box.innerHTML = `<div class="tb" style="margin:0"><span class="sec">${NT.netTitle}</span><span class="sp"></span><button class="b alt sm" id="netRef">${NT.netRefresh}</button></div>
    <div class="hint one" id="netL"></div><div class="hint one" id="netE"></div>`;
  $("netL").textContent = `${NT.netLocal}: ${n.local_base || "—"}`;
  $("netE").textContent = n.enabled ? (n.external_base ? `${NT.netExt}: ${n.external_base}` + (n.external_host ? "" : ` · ${n.source}`) + (n.checked ? ` · ${NT.netChecked} ${new Date(n.checked*1000).toLocaleTimeString()}` : "") + (n.changed ? ` · ${NT.netChanged}: ${n.previous} → ${n.external_ip}` : "") : (n.error ? NT.netErr + ": " + n.error : "…")) : NT.netOff;
  $("netRef").onclick = () => renderNet(true);
}

// ---------- devices
const linkFor = tok => `http://${location.hostname}:${B.public_port}/?t=${tok}`;
function copyRow(label, value){
  const w = document.createElement("div"); w.innerHTML = `<label class="f"></label><div class="copy"><input type="text" readonly><button class="b alt sm">${tr("Kopiuj","Copy")}</button></div>`;
  w.querySelector("label").textContent = label; const i = w.querySelector("input"); i.value = value;
  w.querySelector("button").onclick = async () => { try{ await navigator.clipboard.writeText(value); }catch{ i.select(); document.execCommand("copy"); } toast(tr("Skopiowano ✓","Copied ✓")); };
  return w;
}
function showCreated(d, fresh = true){
  const box = $("created"); box.innerHTML = "";
  const c = document.createElement("div"); c.className = "panel";
  c.innerHTML = `<b>${fresh ? tr("Skopiuj teraz - token możesz skopiować też później.","Copy now - you can also copy the token later.") : tr("Link i token urządzenia","Device link and token")}</b>
    <div class="hint">${tr("Otwórz link na urządzeniu i dodaj go do ekranu głównego.","Open the link on the device and add it to the home screen.")}</div>`;
  c.append(copyRow(tr("Link do urządzenia","Device link"), linkFor(d.token)));
  if(NET && NET.external_base) c.append(copyRow(NT.extLink, NET.external_base + "/?t=" + d.token));
  c.append(copyRow("Token", d.token));
  const a = document.createElement("div"); a.className = "acts"; a.innerHTML = `<button class="b alt sm">${tr("Zamknij","Close")}</button>`; a.firstChild.onclick = () => { box.innerHTML = ""; }; c.append(a);
  box.append(c); c.scrollIntoView({block:"nearest"});
}
function devRow(d){
  const el = document.createElement("div"); el.className = "li click";
  el.innerHTML = `<span class="shape">${HL.icon(d.icon)}</span><div class="n"><b title="${esc(d.prefix)}…"><span class="dot ${d.online ? "on" : ""}" style="margin-right:8px"></span><span class="nm"></span></b><div class="hint"></div></div>
    <button class="b alt sm ed">${tr("Edytuj","Edit")}</button>`;
  el.querySelector(".nm").textContent = d.name;
  el.querySelector(".hint").textContent = [d.user, d.layout.tiles.length + " " + tr("kafelków","tiles"), d.last_seen ? tr("ostatnio","last seen") + " " + new Date(d.last_seen*1000).toLocaleString(undefined, {dateStyle:"short", timeStyle:"short"}) : tr("jeszcze nie połączone","never connected"), d.enabled ? "" : tr("wyłączone","disabled")].filter(Boolean).join(" · ");
  const kb = HL.kebab([["cp", tr("Kopiuj token / link","Copy token / link"), "", !d.can_copy], ["tk", tr("Nowy token / link","New token / link")], ["dl", tr("Usuń","Delete"), "red"]]);
  if(!d.can_copy) kb.querySelector("[data-a=cp]").title = tr("Utworzony przed aktualizacją - wygeneruj nowy token raz","Created before the update - generate a new token once");
  el.append(kb);
  el.onclick = e => { if(!e.target.closest("button,summary,details")) edit(d.id); };
  el.querySelector(".ed").onclick = () => edit(d.id);
  kb.querySelector("[data-a=cp]").onclick = async () => { try{ const r = await api(`devices/${d.id}/secret`); showCreated({token: r.token}, false); }catch(e){ toast(e.message,true); } };
  kb.querySelector("[data-a=tk]").onclick = async () => { if(!confirm(tr("Wygenerować nowy token? Stary przestanie działać.","Generate a new token? The old one stops working."))) return;
    try{ const r = await post(`devices/${d.id}/token`, {}); showCreated(r); await load(); }catch(e){ toast(e.message,true); } };
  kb.querySelector("[data-a=dl]").onclick = async () => { if(!confirm(tr("Usunąć urządzenie?","Delete this device?"))) return;
    try{ await api("devices/" + d.id, {method:"DELETE"}); await load(); }catch(e){ toast(e.message,true); } };
  return el;
}
function renderDevices(){
  $("devEmpty").textContent = tr("Brak urządzeń. Utwórz pierwsze.","No devices yet. Create the first one."); $("devEmpty").hidden = B.devices.length > 0;
  HL.sync($("devList"), B.devices, d => d.id, devRow);
}
$("newBtn").onclick = () => { $("newForm").hidden = !$("newForm").hidden; };
$("nCancel").onclick = () => { $("newForm").hidden = true; };
$("nCreate").onclick = async () => {
  const name = $("nName").value.trim(); if(!name) return toast(tr("Wpisz nazwę","Enter a name"), true);
  try{ const r = await post("devices", {name, user:$("nUser").value, icon:$("nIcon").value, layout:{cols:2,tiles:[]}}); $("nName").value = ""; $("nUser").value = ""; $("newForm").hidden = true; showCreated(r); await load(); }
  catch(e){ toast(e.message,true); }
};

// ---------- editor
const closeTile = () => { const d = $("tileDlg"); if(d.open) d.close(); };
function setDirty(v = true){ dirty = v; $("dirty").hidden = !v; $("dirty").textContent = tr("niezapisane zmiany","unsaved changes"); }
function edit(id){
  cur = B.devices.find(d => d.id === id); W = JSON.parse(JSON.stringify(cur.layout));
  $("eNameIn").value = cur.name; $("eUserIn").value = cur.user || "";
  $("ePhone").innerHTML = `<option value="">—</option>` + [...new Set([...B.notify, cur.phone].filter(Boolean))].map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  $("ePhone").value = cur.phone || ""; $("eLive").value = cur.live || "off"; $("eLiveEnt").value = (cur.live_entities || []).join(", "); if(![...$("eIconIn").options].some(o => o.value === cur.icon)) $("eIconIn").add(new Option(cur.icon, cur.icon)); $("eIconIn").value = cur.icon; $("eColsIn").value = W.cols;
  $("eFeed").checked = cur.show_feed; $("eOn").checked = cur.enabled; $("liveDet").open = !!(cur.phone || (cur.live && cur.live !== "off") || (cur.live_entities || []).length);
  ["auto","jsonBox"].forEach(x => $(x).hidden = true); closeTile();
  setDirty(false); renderTiles(); showEdit(); watchPrev();
}
$("back").onclick = () => { if(dirty && !confirm(tr("Porzucić niezapisane zmiany?","Discard unsaved changes?"))) return; cur = null; show("devices"); };
["eNameIn","eUserIn","eIconIn","eFeed","eOn","ePhone","eLive","eLiveEnt"].forEach(i => $(i).onchange = () => setDirty());
$("eColsIn").onchange = () => { W.cols = +$("eColsIn").value; setDirty(); refreshPrev(); };
$("save").onclick = async () => {
  try{
    const want = W.tiles.length;
    const r = await post("devices/" + cur.id, {name:$("eNameIn").value, user:$("eUserIn").value, phone:$("ePhone").value, live:$("eLive").value, live_entities:$("eLiveEnt").value.split(",").map(x => x.trim()).filter(Boolean), icon:$("eIconIn").value, show_feed:$("eFeed").checked, enabled:$("eOn").checked, layout:W});
    if(r.layout.tiles.length < want) toast(tr(`${want - r.layout.tiles.length} nieprawidłowych kafelków pominięto`, `${want - r.layout.tiles.length} invalid tile(s) were dropped`), true);
    else toast(tr("Zapisano ✓","Saved ✓"));
    W = r.layout; await load(); cur = B.devices.find(d => d.id === r.id); setDirty(false); renderTiles(); watchPrev();
  }catch(e){ toast(e.message,true); }
};
const typeName = t => ({button:tr("przycisk","button"),toggle:tr("przełącznik","toggle"),slider:tr("suwak","slider"),state:tr("stan","state")}[t]);
function tileSummary(t){
  if(t.type === "button"){ const a = t.action; return a.kind === "service" ? a.service + (a.entity_id ? " → " + a.entity_id : "") : a.kind === "event" ? "event " + a.event_type : a.kind === "live" ? "Live Activity: " + ((B.activities.find(x => x.id === a.activity) || {}).name || a.activity) : a.kind + " " + a.entity_id; }
  return t.entity_id + (t.type === "slider" ? " · " + t.mode : "") + (t.attribute ? " · " + t.attribute : "");
}
function renderTiles(){
  const box = $("tileList"); box.innerHTML = W.tiles.length ? "" : `<div class="hint" style="padding:16px 0">${tr("Brak kafelków. Dodaj ręcznie albo „Z encji”.","No tiles yet. Add one or use “From entities”.")}</div>`;
  W.tiles.forEach((t, i) => {
    const el = document.createElement("div"); el.className = "li click";
    el.innerHTML = `<span class="shape">${HL.icon(HL.tileIcon(t))}</span><div class="n"><b></b><div class="hint"></div></div>
      <button class="b alt sm ic" data-a="up" aria-label="${tr("W górę","Move up")}"${i === 0 ? " disabled" : ""}>${HL.icon("mdi:arrow-up")}</button><button class="b alt sm ic" data-a="dn" aria-label="${tr("W dół","Move down")}"${i === W.tiles.length - 1 ? " disabled" : ""}>${HL.icon("mdi:arrow-down")}</button>`;
    el.querySelector("b").textContent = t.label || t.entity_id || "—"; el.querySelector(".hint").textContent = typeName(t.type) + " · " + tileSummary(t) + (t.width === 2 ? " · 2×" : "");
    el.append(HL.kebab([["ed", tr("Edytuj","Edit")], ["cp", tr("Duplikuj","Duplicate")], ...(t.type === "slider" || t.type === "state" ? [] : [["ts", tr("Wykonaj teraz","Run now")]]), ["rm", tr("Usuń","Delete"), "red"]]));
    el.onclick = async e => {
      const a = (e.target.closest("[data-a]") || {dataset:{}}).dataset.a;
      if(!a){ if(!e.target.closest("summary,details")) tileForm(t, i); return; }
      if(a === "up" && i > 0) [W.tiles[i-1], W.tiles[i]] = [W.tiles[i], W.tiles[i-1]];
      else if(a === "dn" && i < W.tiles.length - 1) [W.tiles[i+1], W.tiles[i]] = [W.tiles[i], W.tiles[i+1]];
      else if(a === "ed") return tileForm(t, i);
      else if(a === "cp") W.tiles.splice(i+1, 0, {...JSON.parse(JSON.stringify(t)), id:"", label:(t.label||"") + " 2"});
      else if(a === "rm") W.tiles.splice(i, 1);
      else if(a === "ts"){
        if(dirty){ toast(tr("Najpierw zapisz zmiany","Save your changes first"), true); return; }
        if(!confirm(tr("Wykonać tę akcję teraz w Home Assistant?","Run this action in Home Assistant now?"))) return;
        try{ const r = await post("test", {device_id:cur.id, tile:t.id}); toast(r.ok ? "OK" : r.error, !r.ok); }catch(err){ toast(err.message,true); } return;
      } else return;
      setDirty(); renderTiles();
    };
    box.append(el);
  });
  refreshPrev();
}

    <div class="chips" id="aDevs">${B.devices.map(d => `<label><input type="checkbox" value="${esc(d.id)}" ${(A.devices || []).includes(d.id) ? "checked" : ""}> ${esc((d.user ? d.user + " – " : "") + d.name)}${d.phone ? "" : " (" + tr("brak telefonu","no phone") + ")"}</label>`).join("") || `<span class="hint">${tr("Brak urządzeń.","No devices.")}</span>`}</div>
    <div class="hint" style="margin-top:4px">${tr("Urządzenie bez telefonu nie wyświetli aktywności. Użytkownik z uprawnieniami może ją u siebie wyłączyć.","A device without a phone cannot show it. A user with permission can turn it off for themselves.")}</div>
    <label class="f">${tr("Encja, która steruje aktywnością","Entity that drives the activity")}</label><input type="text" id="aEnt" list="dlEnt" value="${esc(A.entity_id)}" placeholder="sensor.pralka">
    <label class="f">${tr("Szablon (wypełnia pola)","Preset (fills the fields)")}</label>
    <div class="chips">${PRESETS.map(([id, l]) => `<button type="button" class="b alt sm" data-p="${id}">${esc(l)}</button>`).join("")}</div>
    <div class="row"><div class="grow"><label class="f">${tr("Start gdy stan ∈ (po przecinku; puste = każdy poza końcowymi)","Start when state ∈ (comma list; empty = any except end states)")}</label><input type="text" id="aStart" value="${esc(csv(A.start_states))}"></div>
    <div class="grow"><label class="f">${tr("Koniec gdy stan ∈ (po przecinku)","End when state ∈ (comma list)")}</label><input type="text" id="aEnd" value="${esc(csv(A.end_states))}"></div></div>
    <label class="f">${tr("Tytuł (stały, ustawiany przy starcie)","Title (fixed, set at start)")}</label><input type="text" id="aTitle" value="${esc(A.title)}">
    <label class="f">${tr("Treść (zwykły tekst lub szablon HA)","Message (plain text or HA template)")}</label><textarea id="aMsg" style="min-height:64px">${esc(A.message)}</textarea>
    <details class="sub" style="margin-top:16px"><summary>${tr("Wygląd: tekst na wyspie, postęp, odliczanie, ikona","Display: island text, progress, countdown, icon")}</summary><div>
      <label class="f" style="margin-top:0">${tr("Tekst na wyspie (compact) – opcjonalnie","Dynamic Island compact text – optional")}</label><input type="text" id="aCrit" value="${esc(A.critical_text)}" placeholder="{{ states('sensor.x') }}%">
      <div class="row"><div class="grow"><label class="f">${tr("Pasek postępu","Progress bar")}</label><select id="aPm"><option value="none" ${A.progress_mode==="none"?"selected":""}>${tr("brak","none")}</option><option value="range" ${A.progress_mode==="range"?"selected":""}>${tr("z wartości encji (min–max)","from entity value (min–max)")}</option></select></div>
      <div class="grow"><label class="f">${tr("Atrybut (puste = stan)","Attribute (empty = state)")}</label><input type="text" id="aPa" value="${esc(A.progress_attr)}"></div>
      <div class="grow" style="min-width:80px"><label class="f">min</label><input type="number" id="aPmin" value="${A.progress_min}"></div><div class="grow" style="min-width:80px"><label class="f">max</label><input type="number" id="aPmax" value="${A.progress_max}"></div></div>
      <label class="f">${tr("Odliczanie: atrybut z czasem końca (np. finishes_at)","Countdown: attribute with end time (e.g. finishes_at)")}</label><input type="text" id="aCh" value="${esc(A.chrono_attr)}">
      <label class="chk"><input type="checkbox" id="aChS" ${A.chrono_state?"checked":""}> ${tr("Stan encji jest czasem końca (timestamp)","Entity state is the end time (timestamp)")}</label>
      <label class="f">${tr("Ikona","Icon")}</label>
      <div class="tl-n"><span class="shape" id="aIconPrev"></span><input type="text" id="aIcon" value="${esc(A.icon)}"><input type="color" id="aColor" value="${esc(A.color)}"></div><div id="aPick"></div>
    </div></details>
    <details class="sub"><summary>${tr("Zaawansowane","Advanced")}</summary><div>
      <div class="row" style="margin-top:0"><div class="grow"><label class="f">tag</label><input type="text" id="aTag" value="${esc(A.tag)}" placeholder="${tr("auto","auto")}"></div>
      <div class="grow"><label class="f">${tr("Min. odstęp aktualizacji (s)","Min. update interval (s)")}</label><input type="number" id="aInt" min="5" max="3600" value="${A.min_interval}"></div>
      <div class="grow"><label class="f">relevance_score 0–1</label><input type="number" id="aRel" step="0.1" min="0" max="1" value="${A.relevance ?? ""}"></div></div>
      <div class="row"><div class="grow"><label class="f">background_color</label><input type="text" id="aBg" value="${esc(A.background_color)}" placeholder="#101820"></div>
      <div class="grow"><label class="f">text_color</label><input type="text" id="aTx" value="${esc(A.text_color)}" placeholder="#FFFFFF"></div></div>
      <label class="f">${tr("Po dotknięciu otwórz (np. /lovelace/0)","Open on tap (e.g. /lovelace/0)")}</label><input type="text" id="aUrl" value="${esc(A.url)}">
    </div></details>
    <label class="chk"><input type="checkbox" id="aOn" ${A.enabled?"checked":""}> ${tr("Włączona (reaguje na zmiany stanu)","Enabled (reacts to state changes)")}</label>
    <pre id="aPrev" hidden></pre>
    <div class="acts"><button class="b alt" id="aCancel">${tr("Anuluj","Cancel")}</button><button class="b alt" id="aPreview">${tr("Podgląd ładunku","Preview payload")}</button><button class="b" id="aSave">${tr("Zapisz","Save")}</button></div>`;
  const val = () => ({id:A.id, name:$("aName").value, enabled:$("aOn").checked, devices:[...document.querySelectorAll("#aDevs input:checked")].map(i => i.value), phones:[...document.querySelectorAll("#aPhones input:checked")].map(i => i.value),
    entity_id:$("aEnt").value.trim(), start_states:$("aStart").value, end_states:$("aEnd").value, title:$("aTitle").value, message:$("aMsg").value, critical_text:$("aCrit").value,
    progress_mode:$("aPm").value, progress_attr:$("aPa").value, progress_min:+$("aPmin").value, progress_max:+$("aPmax").value, chrono_attr:$("aCh").value.trim(), chrono_state:$("aChS").checked,
    icon:$("aIcon").value.trim(), color:$("aColor").value, tag:$("aTag").value.trim(), min_interval:+$("aInt").value || 30, relevance:$("aRel").value, background_color:$("aBg").value.trim(), text_color:$("aTx").value.trim(), url:$("aUrl").value.trim()});
  const prev = () => { $("aIconPrev").innerHTML = HL.icon($("aIcon").value); $("aIconPrev").style.color = $("aColor").value; };
  $("aIcon").oninput = prev; $("aColor").oninput = prev; iconPicker($("aPick"), $("aIcon"), prev); prev();
  box.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    const e = $("aEnt").value.trim(); if(!e) return toast(tr("Najpierw wybierz encję","Pick the entity first"), true);
    const o = PRESETS.find(x => x[0] === b.dataset.p)[2](e);
    const set = (id, v) => { if(v !== undefined) $(id).value = v; };
    set("aStart", o.start_states); set("aEnd", o.end_states); set("aMsg", o.message); set("aIcon", o.icon); if(o.color) set("aColor", o.color);
    set("aPm", o.progress_mode); if(o.progress_min != null) set("aPmin", o.progress_min); if(o.progress_max != null) set("aPmax", o.progress_max);
    set("aCh", o.chrono_attr ?? ""); set("aInt", o.min_interval); set("aRel", o.relevance ?? ""); if(!$("aTitle").value) set("aTitle", $("aName").value || e); prev(); });
  $("aCancel").onclick = () => $("actDlg").close();
  $("aPreview").onclick = async () => { try{ const r = await post("activities/preview", val()); $("aPrev").hidden = false; $("aPrev").textContent = JSON.stringify(r, null, 1); }catch(e){ toast(e.message,true); } };
  $("aSave").onclick = async () => {
    try{ const v = val(); if(!v.phones.length && !v.devices.length) return toast(tr("Wybierz telefon albo urządzenie, któremu dajesz aktywność","Pick a phone or a device to give the activity to"), true);
      await post("activities", v); $("actDlg").close(); toast(tr("Zapisano ✓","Saved ✓")); await load(); renderActs(); }catch(e){ toast(e.message,true); } };
}

// ---------- usage: which entities each device / user actually used (also written to the HA Logbook + sensors)
$("logbookLink").textContent = tr("Otwórz Logbook HA","Open HA Logbook"); $("usageClear").textContent = tr("Wyzeruj","Reset");
$("usageInfo").innerHTML = tr(
  "Każda akcja jest zapisywana w <b>Logbooku</b> Home Assistanta („Kto (urządzenie) nacisnął …”) oraz w sensorach <code>sensor.haliveteo_&lt;urządzenie&gt;_last_action</code> i <code>sensor.haliveteo_last_action</code> (historia i automatyzacje). Poniżej licznik użyć encji dla każdego urządzenia.",
  "Every action is written to the Home Assistant <b>Logbook</b> (“Who (device) pressed …”) and to the sensors <code>sensor.haliveteo_&lt;device&gt;_last_action</code> and <code>sensor.haliveteo_last_action</code> (history and automations). Below: how often each entity was used per device.");
async function renderUsage(){
  const box = $("usageList"); let rows;
  try{ rows = await api("usage"); }catch(e){ return toast(e.message, true); }
  box.innerHTML = ""; if(!rows.length) box.innerHTML = `<div class="hint" style="padding:16px 0">${tr("Brak urządzeń.","No devices.")}</div>`;
  rows.forEach(r => { const c = document.createElement("div"); c.style.marginBottom = "16px";
    const total = r.items.reduce((a, x) => a + x.n, 0);
    c.innerHTML = `<div class="tb" style="margin:8px 0 0"><span class="sec nm"></span><span class="sp"></span><span class="badge">${total} ${tr("akcji","actions")}</span></div><div class="ul"></div>`;
    c.querySelector(".nm").textContent = (r.user ? r.user + " – " : "") + r.device;
    const ul = c.querySelector(".ul"); ul.innerHTML = r.items.length ? "" : `<div class="hint">${tr("Jeszcze nic nie użyto.","Nothing used yet.")}</div>`;
    r.items.forEach(x => { const row = document.createElement("div"); row.className = "li";
      row.innerHTML = `<span class="shape">${HL.icon(x.entity_id ? "mdi:" + (HL.DEFAULT_ICON[x.entity_id.split(".")[0]] || "eye") : "mdi:gesture-tap")}</span><div class="n"><b></b><div class="hint"></div></div><span class="badge">${x.n}×</span>`;
      row.querySelector("b").textContent = x.label || x.key; row.querySelector(".hint").textContent = (x.entity_id || x.type) + " · " + tr("ostatnio","last") + " " + new Date(x.last * 1000).toLocaleString(undefined, {dateStyle:"short", timeStyle:"short"});
      ul.append(row); });
    box.append(c); });
}
$("usageClear").onclick = async () => { if(!confirm(tr("Wyzerować liczniki użycia?","Reset usage counters?"))) return; try{ await api("usage", {method:"DELETE"}); renderUsage(); }catch(e){ toast(e.message, true); } };

// ---------- feed: rows are built once; new entries are added on top without redrawing the list
function feedRow(e){
  const el = document.createElement("div"); el.className = "li";
  el.innerHTML = `<div class="n"><b></b><div class="hint"></div></div>`;
  el.querySelector("b").textContent = e.label || e.type;
  el.querySelector(".hint").textContent = [e.device, new Date(e.ts*1000).toLocaleTimeString(), e.source, (e.entity_id || "") + (e.value != null ? " = " + JSON.stringify(e.value) : "")].filter(Boolean).join(" · ") + (e.ok ? "" : " ✗ " + e.error);
  if(!e.ok) el.querySelector(".hint").classList.add("bad");
  return el;
}
function renderFeed(){
  const box = $("feedList"); box.innerHTML = ""; $("feedEmpty").textContent = tr("Czekam na akcje z urządzeń…","Waiting for actions from your devices…");
  $("feedEmpty").hidden = B.feed.length > 0;
  B.feed.slice().reverse().forEach(e => box.append(feedRow(e)));
}
function addFeed(e){
  const box = $("feedList"); $("feedEmpty").hidden = true; box.prepend(feedRow(e));
  while(box.children.length > 200) box.lastChild.remove();
}
$("feedClear").onclick = async () => { try{ await api("feed", {method:"DELETE"}); B.feed = []; renderFeed(); }catch(e){ toast(e.message,true); } };

// ---------- help
function renderHelp(){
  const host = `http://${esc(location.hostname)}:${B.public_port}`, p = esc(B.prefix);
  $("helpBox").innerHTML = tr(`
  <div class="sec" style="margin-top:16px">Jak to działa</div>
  <p>Każde urządzenie (telefon, tablet, panel ścienny, skrypt) dostaje własny <b>token</b> i własny <b>układ kafelków</b>. Kafelki działają na żywo: stan z Home Assistanta aktualizuje się natychmiast, a akcje wracają jako zdarzenia.</p>
  <div class="sec" style="margin-top:16px">1. Przypięcie do ekranu</div>
  <p><b>iPhone / iPad:</b> otwórz link urządzenia w <b>Safari</b> → <b>Udostępnij → Do ekranu początkowego → Dodaj</b>. Ikona dostaje nazwę urządzenia i otwiera się na pełnym ekranie. <i>Token jest w adresie celowo</i> – aplikacje z ekranu głównego iOS mają własną, osobną pamięć i inaczej nie znałyby tokenu.</p>
  <p><b>Android:</b> Chrome → menu ⋮ → <b>Zainstaluj aplikację</b>. <b>Ekran blokady iPhone'a:</b> Skróty → nowy skrót → <b>Otwórz URL</b> (link urządzenia) → widżet Skrótów na ekranie blokady albo przycisk Action. Menu ⋯ na urządzeniu ma „Dodaj do ekranu głównego” z tymi krokami i kopiowaniem adresu.</p>
  <div class="sec" style="margin-top:16px">2. Kto czego używał</div>
  <p>Ustaw urządzeniu <b>Użytkownika</b>. Każda akcja trafia do <b>Logbooka</b> HA oraz do sensorów <code>sensor.haliveteo_…_last_action</code>; zakładka <b>Użycie</b> pokazuje liczniki encji.</p>
  <div class="sec" style="margin-top:16px">3. Urządzenia bez ekranu / skróty / ESP</div>
  <pre>curl -X POST ${host}/api/device/action \\
  -H "Authorization: Bearer TOKEN" -d '{"tile":"ID_KAFELKA"}'

curl -X POST ${host}/api/device/event \\
  -H "Authorization: Bearer TOKEN" -d '{"event":"dzwonek","data":{"pietro":1}}'</pre>
  <p>Urządzenie może wywołać <b>tylko</b> akcje zdefiniowane w jego układzie – nie ma dostępu do reszty HA. Limit: 25 akcji / 10 s.</p>
  <div class="sec" style="margin-top:16px">4. Reakcja w Home Assistant</div>
  <p>Każda akcja wysyła zdarzenie <code>${p}_action</code>, a zdarzenia z urządzeń <code>${p}_event</code>:</p>
  <pre>trigger:
  - platform: event
    event_type: ${p}_action
    event_data: {device: "Tablet w kuchni", label: "Dzwonek"}
action:
  - service: notify.notify
    data: {message: "Ktoś nacisnął dzwonek"}</pre>`, `
  <div class="sec" style="margin-top:16px">How it works</div>
  <p>Each device (phone, tablet, wall panel, script) gets its own <b>token</b> and its own <b>tile layout</b>. Tiles are live: Home Assistant states update instantly, and actions come back as events.</p>
  <div class="sec" style="margin-top:16px">1. Pin to the screen</div>
  <p><b>iPhone / iPad:</b> open the device link in <b>Safari</b> → <b>Share → Add to Home Screen → Add</b>. The icon gets the device name and opens full screen. <i>The token is in the address on purpose</i> – iOS home-screen apps have their own isolated storage and would not know it otherwise.</p>
  <p><b>Android:</b> Chrome → menu ⋮ → <b>Install app</b>. <b>iPhone Lock Screen:</b> Shortcuts → new shortcut → <b>Open URL</b> (the device link) → Shortcuts widget on the Lock Screen or the Action button. The ⋯ menu on the device has “Add to Home Screen” with these steps and a copy-address button.</p>
  <div class="sec" style="margin-top:16px">2. Who used what</div>
  <p>Set a <b>User</b> on the device. Every action goes to the HA <b>Logbook</b> and to the sensors <code>sensor.haliveteo_…_last_action</code>; the <b>Usage</b> tab shows per-entity counters.</p>
  <div class="sec" style="margin-top:16px">3. Screenless devices / Shortcuts / ESP</div>
  <pre>curl -X POST ${host}/api/device/action \\
  -H "Authorization: Bearer TOKEN" -d '{"tile":"TILE_ID"}'

curl -X POST ${host}/api/device/event \\
  -H "Authorization: Bearer TOKEN" -d '{"event":"doorbell","data":{"floor":1}}'</pre>
  <p>A device can <b>only</b> trigger actions defined in its own layout – it has no access to the rest of HA. Limit: 25 actions / 10 s.</p>
  <div class="sec" style="margin-top:16px">4. React in Home Assistant</div>
  <p>Every action fires the event <code>${p}_action</code>; events sent by devices fire <code>${p}_event</code>:</p>
  <pre>trigger:
  - platform: event
    event_type: ${p}_action
    event_data: {device: "Kitchen tablet", label: "Doorbell"}
action:
  - service: notify.notify
    data: {message: "Someone pressed the bell"}</pre>`);
}

load().catch(e => toast(e.message, true));
show("devices");
</script>
</body>
</html>
