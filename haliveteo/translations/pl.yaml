configuration:
  event_prefix:
    name: Prefiks nazw zdarzeń
    description: "Zdarzenia w Home Assistant nazywają się <prefiks>_action i <prefiks>_event (domyślnie haliveteo_action / haliveteo_event)."
  logbook:
    name: Zapisuj akcje w Logbooku
    description: "Każda akcja trafia do Logbooka Home Assistanta (kto czego użył)."
  sensors:
    name: Twórz sensory ostatniej akcji
    description: "Tworzy sensor.haliveteo_<urządzenie>_last_action i sensor.haliveteo_last_action (historia + automatyzacje)."
  check_external_ip:
    name: Sprawdzaj zewnętrzny IP
    description: "Sprawdza publiczny adres IP w api.ipify.org / icanhazip.com / ifconfig.me (maks. co 10 min), pokazuje go obok lokalnego, używa w linkach spoza domu i publikuje jako sensor. Wyłącz, aby nigdy nie łączyć się z tymi usługami."
  external_host:
    name: Zewnętrzny host (DDNS)
    description: "Opcjonalna nazwa hosta lub IP używane w linkach spoza domu (np. mojadomena.duckdns.org). Puste = wykryty zewnętrzny IP."
  log_level:
    name: Poziom logów
    description: Szczegółowość logów dodatku.
