configuration:
  cat_name:
    name: Imię kota
    description: Używane w panelu, powiadomieniach i nazwach sensorów (sensor.<imie>_last_fed ...). Można też zmienić w panelu.
  cat_age_years:
    name: Wiek (lata)
    description: Użyte raz do ustawienia przybliżonych urodzin, jeśli nie wpisałeś ich w panelu. Od 11 lat włączają się łagodne ustawienia dla seniora (kontrola u weterynarza co 6 miesięcy, alarm wagi przy 5 %).
  cat_birthday:
    name: Urodziny (MM-DD)
    description: Dzień i miesiąc urodzin, np. 12-03. Razem z wiekiem daje dokładną datę; w dniu urodzin dostaniesz powiadomienie.
  notify_services:
    name: Telefony do przypomnień
    description: Usługi powiadomień aplikacji mobilnej, np. mobile_app_iphone. Przypomnienia mają przycisk „Zrobione”, także na ekranie blokady.
  api_enabled:
    name: Punkt dla Skrótów / Siri
    description: Otwiera port 8771 (wymaga tokenu). Pozwala zapisać „nakarmiony” jednym dotknięciem lub komendą głosową.
  log_level:
    name: Poziom logów
    description: Szczegółowość logów dodatku.
