<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAFreudTeo</title>
<link rel="stylesheet" href="static/common.css">
<style>
main{max-width:640px;margin:0 auto;padding:16px}
.hero{display:flex;gap:16px;align-items:center;margin:4px 0 20px}
.hero img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--secondary-background-color)}
.hero .nm{font-size:24px;line-height:30px}
.line{margin:0 0 8px;color:var(--secondary-text-color)}
.line.warn{color:var(--primary-text-color)}
.rows{border-top:1px solid var(--divider-color)}
.r{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--divider-color);flex-wrap:wrap}
.r .n{flex:1;min-width:150px}.r .n b{font-weight:500}
.r .more{flex-basis:100%;display:none;gap:8px;align-items:center}.r.open .more{display:flex}
button.link{background:none;border:0;color:var(--primary-color);font:500 13px/20px var(--ha-font);padding:6px 4px;cursor:pointer}
.day{color:var(--secondary-text-color);font-size:12px;margin:20px 0 4px;letter-spacing:.04em;text-transform:uppercase}
.ev{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--divider-color)}
.ev .t{width:48px;color:var(--secondary-text-color);flex:none}.ev .n{flex:1}.ev small{color:var(--secondary-text-color)}
.set h3{font-size:14px;font-weight:500;margin:28px 0 8px;color:var(--secondary-text-color)}
.tk{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--divider-color)}
.tk input[type=number]{width:72px;min-height:36px;padding:6px 10px}
.times{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.times input{width:140px;min-height:36px;padding:6px 10px}
input[type=date],input[type=datetime-local]{width:100%;min-height:48px;padding:12px 16px;border:0;border-bottom:1px solid var(--input-idle-line-color);border-radius:4px 4px 0 0;background:var(--input-fill-color);color:var(--primary-text-color);font:400 16px/24px var(--ha-font)}
.r .more input{width:auto;min-height:36px;padding:6px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}.kv span:nth-child(odd){color:var(--secondary-text-color)}
svg.chart{width:100%;height:160px;display:block}
.in{display:flex;gap:8px;align-items:flex-end}.in input{flex:1}
footer{margin-top:32px}
</style>
</head>
<body>
<div class="bar"><h1 id="barT"></h1></div>
<main>
<div class="tabs" id="tabs"></div>

<div class="view" id="v-today">
  <div class="hero"><img id="av" alt=""><div><div class="nm" id="nm"></div><div class="hint" id="sub"></div></div></div>
  <div class="line" id="attn"></div>
  <div class="rows" id="rows"></div>
</div>

<div class="view" id="v-hist"><div id="hist"></div></div>

<div class="view" id="v-wt">
  <div class="in"><div style="flex:1"><label class="f" id="lWt"></label><input type="number" id="wtIn" step="0.01" min="0.3" max="25" inputmode="decimal"></div><button class="b" id="wtAdd"></button></div>
  <div class="hint" id="wtChange" style="margin:10px 0"></div>
  <svg class="chart" id="chart" viewBox="0 0 600 160" preserveAspectRatio="none"></svg>
  <div id="wtList"></div>
</div>

<div class="view set" id="v-set"><div id="setBody"></div></div>

<footer><span id="by"></span> <a href="https://teodorteo.com" target="_blank" rel="noopener">TeodorTeo.com</a></footer>
</main>
<script src="static/common.js"></script>
<script>
const $ = id => document.getElementById(id), tr = HL.tr, esc = HL.esc;
let S = null, tab = "today";
const NAMES = {feed:tr("Karmienie","Feeding"), water:tr("Woda","Water"), litter:tr("Kuweta","Litter box"), litter_full:tr("Kuweta - pełna wymiana","Litter box - full change"),
  flea:tr("Pchły i kleszcze","Flea and tick"), deworm:tr("Odrobaczanie","Deworming"), vaccine:tr("Szczepienie","Vaccination"), vet:tr("Wizyta u weterynarza","Vet visit"), weight:tr("Waga","Weight")};
const loc = HL.lang === "pl" ? "pl-PL" : "en-GB";
const hm = ts => new Date(ts * 1000).toLocaleTimeString(loc, {hour:"2-digit", minute:"2-digit"});
const dayKey = ts => new Date(ts * 1000).toLocaleDateString(loc, {weekday:"long", day:"numeric", month:"long"});
const days = h => h % 24 === 0 ? h / 24 : +(h / 24).toFixed(2);
const who = () => { try{ return localStorage.getItem("hft_who") || ""; }catch{ return ""; } };

function age(b, approx){ if(!b) return ""; const d = new Date(b), n = new Date(); let y = n.getFullYear() - d.getFullYear(), m = n.getMonth() - d.getMonth(); if(n.getDate() < d.getDate()) m--; if(m < 0){ y--; m += 12; }
  const t = y > 0 ? (HL.lang === "pl" ? (y === 1 ? "1 rok" : (y % 10 >= 2 && y % 10 <= 4 && (y < 10 || y > 20)) ? y + " lata" : y + " lat") : y + (y === 1 ? " year" : " years")) : (HL.lang === "pl" ? m + " mies." : m + " mo.");
  return (approx ? "~" : "") + t; }

const TABS = [["today", tr("Dziś","Today")], ["hist", tr("Historia","History")], ["wt", tr("Waga","Weight")], ["set", tr("Ustawienia","Settings")]];
TABS.forEach(([id, l]) => { const b = document.createElement("button"); b.textContent = l; b.dataset.id = id; b.onclick = () => show(id); $("tabs").append(b); });
function show(id){ tab = id; document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === id)); document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + id)); render(); }
$("by").textContent = tr("Stworzone przez","Created by");
$("lWt").textContent = tr("Waga (kg)","Weight (kg)"); $("wtAdd").textContent = tr("Dodaj","Add");

async function load(){ try{ S = await HL.api("state"); render(); }catch(e){ /* keep last */ } }
function render(){
  if(!S) return;
  document.title = S.name; $("barT").textContent = S.name; $("nm").textContent = S.name; $("av").src = "avatar" + (S._av ? "?" + S._av : "");
  const a = age(S.cfg.birthday, S.cfg.birthday_approx); $("sub").textContent = [a, S.weight_change != null && Math.abs(S.weight_change) >= S.weight_alert ? tr("zmiana wagi ","weight change ") + (S.weight_change > 0 ? "+" : "") + S.weight_change + "%" : ""].filter(Boolean).join(" · ");
  ({today: rToday, hist: rHist, wt: rWt, set: rSet})[tab]();
}

/* ---- today */
function stText(s){
  if(s.id === "feed"){ const t = [`${tr("dziś","today")} ${s.fed_today}/${s.meals}`]; if(s.last) t.push(`${hm(s.last)}${s.who ? " " + s.who : ""}`); if(s.next && s.fed_today < s.meals) t.push(tr("następny ","next ") + hm(s.next)); if(S.cfg.portion_g) t.push(S.cfg.portion_g + " g"); return t.join(" · "); }
  if(s.state === "new") return tr("brak wpisów","no entries");
  const t = [HL.ago(s.last) + (s.who ? " · " + s.who : "")];
  if(s.state === "due") t.push(tr("do zrobienia","due")); else t.push(tr("za ","in ") + (s.due_at - S.now < 172800 ? Math.max(1, Math.round((s.due_at - S.now) / 3600)) + " h" : Math.round((s.due_at - S.now) / 86400) + " " + tr("dni","days")));
  return t.join(" · ");
}
function rToday(){
  const due = S.status.filter(s => s.state === "due").map(s => NAMES[s.id]);
  $("attn").className = "line" + (due.length ? " warn" : ""); $("attn").textContent = due.length ? tr("Do zrobienia: ","To do: ") + due.join(", ") : tr("Wszystko w porządku.","All good.");
  const box = $("rows"); box.innerHTML = "";
  S.status.forEach(s => {
    const r = document.createElement("div"); r.className = "r";
    r.innerHTML = `<div class="n"><b></b><div class="hint"></div></div><button class="link mo">…</button><button class="b ${s.id === "feed" || s.state === "due" ? "" : "alt"} sm go"></button>
      <div class="more"><input type="datetime-local" class="dt"><button class="b alt sm ok"></button></div>`;
    r.querySelector("b").textContent = NAMES[s.id]; r.querySelector(".hint").textContent = stText(s);
    r.querySelector(".go").textContent = s.id === "feed" ? tr("Nakarmiony","Fed") : tr("Zrobione","Done");
    r.querySelector(".ok").textContent = tr("Zapisz","Save");
    r.querySelector(".go").onclick = () => doLog(s.id);
    r.querySelector(".mo").onclick = () => r.classList.toggle("open");
    r.querySelector(".ok").onclick = () => { const v = r.querySelector(".dt").value; if(v) doLog(s.id, {ts: new Date(v).getTime() / 1000}); };
    box.append(r);
  });
}
async function doLog(task, extra = {}, force = false){
  try{ await HL.post("log", {task, who: who(), force, ...extra}); HL.toast(tr("Zapisano","Saved")); await load(); }
  catch(e){ if(/409|min/.test(e.message) && !force && task === "feed" && !extra.ts){ if(confirm(e.message + "\n" + tr("Zapisać mimo to?","Log it anyway?"))) doLog(task, extra, true); } else HL.toast(e.message, true); }
}

/* ---- history */
function rHist(){
  const box = $("hist"); box.innerHTML = ""; let cur = "";
  if(!S.events.length){ box.innerHTML = `<div class="hint">${tr("Brak wpisów.","No entries yet.")}</div>`; return; }
  S.events.forEach(e => {
    const k = dayKey(e.ts); if(k !== cur){ cur = k; const d = document.createElement("div"); d.className = "day"; d.textContent = k; box.append(d); }
    const r = document.createElement("div"); r.className = "ev";
    r.innerHTML = `<span class="t">${hm(e.ts)}</span><span class="n"></span><button class="link">${tr("Usuń","Delete")}</button>`;
    r.querySelector(".n").innerHTML = `${esc(NAMES[e.task] || e.task)}${e.value != null ? " " + e.value + " kg" : ""} <small>${esc(e.who || "")}</small>`;
    r.querySelector("button").onclick = async () => { if(!confirm(tr("Usunąć wpis?","Delete this entry?"))) return; await HL.api("event/" + e.id, {method:"DELETE"}); load(); };
    box.append(r);
  });
}

/* ---- weight */
$("wtAdd").onclick = async () => { const v = $("wtIn").value; if(!v) return; try{ await HL.post("log", {task:"weight", value:+v, who:who()}); $("wtIn").value = ""; HL.toast(tr("Zapisano","Saved")); load(); }catch(e){ HL.toast(e.message, true); } };
function rWt(){
  const w = S.events.filter(e => e.task === "weight").reverse(), c = $("chart");
  $("wtChange").textContent = S.weight_change == null ? "" : tr("Zmiana względem ostatnich tygodni: ","Change vs. recent weeks: ") + (S.weight_change > 0 ? "+" : "") + S.weight_change + "%";
  c.innerHTML = ""; $("wtList").innerHTML = "";
  if(w.length >= 2){
    const xs = w.map(e => e.ts), ys = w.map(e => e.value), x0 = Math.min(...xs), x1 = Math.max(...xs), lo = Math.min(...ys) - .1, hi = Math.max(...ys) + .1;
    const X = t => 10 + (x1 === x0 ? 290 : (t - x0) / (x1 - x0) * 580), Y = v => 145 - (v - lo) / (hi - lo) * 125;
    c.innerHTML = `<polyline fill="none" stroke="var(--primary-color)" stroke-width="2" vector-effect="non-scaling-stroke" points="${w.map(e => X(e.ts) + "," + Y(e.value)).join(" ")}"/>` +
      w.map(e => `<circle cx="${X(e.ts)}" cy="${Y(e.value)}" r="3" fill="var(--primary-color)" vector-effect="non-scaling-stroke"/>`).join("");
  }
  w.slice().reverse().slice(0, 12).forEach(e => { const r = document.createElement("div"); r.className = "ev"; r.innerHTML = `<span class="t" style="width:90px">${new Date(e.ts * 1000).toLocaleDateString(loc, {day:"numeric", month:"short"})}</span><span class="n">${e.value} kg</span>`; $("wtList").append(r); });
}

/* ---- settings */
function rSet(){
  if(document.activeElement && $("setBody").contains(document.activeElement)) return;   // do not rebuild while typing
  const c = S.cfg, b = $("setBody"); b.innerHTML = "";
  const h = (t, html) => { const d = document.createElement("div"); d.innerHTML = `<h3>${t}</h3>` + html; b.append(d); return d; };
  const g = h(tr("Kot","Cat"), `<label class="f">${tr("Imię","Name")}</label><input type="text" id="sName" maxlength="30" value="${esc(S.name)}">
    <div class="row"><div class="grow"><label class="f">${tr("Urodziny","Birthday")}</label><input type="date" id="sBd" value="${esc(c.birthday)}"></div>
    <div class="grow"><label class="f">${tr("Porcja (g)","Portion (g)")}</label><input type="number" id="sPortion" min="1" max="500" value="${c.portion_g}"></div></div>
    <div class="row"><button class="b alt sm" id="avUp">${tr("Zmień zdjęcie","Change photo")}</button><button class="b alt sm" id="avDel">${tr("Przywróć domyślne","Reset photo")}</button><input type="file" id="avFile" accept="image/*" hidden></div>
    <label class="f">${tr("Kto zapisuje na tym urządzeniu","Who is logging on this device")}</label><input type="text" id="sWho" maxlength="30" placeholder="${tr("np. Tomek","e.g. Tom")}" value="${esc(who())}">`);
  const t = h(tr("Zadania","Tasks"), "");
  Object.keys(NAMES).filter(k => k !== "weight").forEach(id => {
    const tk = c.tasks[id], r = document.createElement("div"); r.className = "tk"; r.dataset.id = id;
    r.innerHTML = `<span>${NAMES[id]}</span><input type="checkbox" class="en" ${tk.enabled ? "checked" : ""} aria-label="on">` +
      (id === "feed" ? `<span></span><label class="chk" style="margin:0"><input type="checkbox" class="rm" ${tk.remind ? "checked" : ""}></label>` :
       `<span class="hint"><input type="number" class="iv" min="0.04" step="any" value="${days(tk.every_h)}"> ${tr("dni","days")}</span><label class="chk" style="margin:0"><input type="checkbox" class="rm" ${tk.remind ? "checked" : ""}></label>`);
    t.append(r);
  });
  const hint = document.createElement("div"); hint.className = "hint"; hint.textContent = tr("Kolumny: włączone · co ile dni · przypomnienia na telefonie","Columns: on · every N days · phone reminders"); t.append(hint);
  const f = h(tr("Godziny karmienia","Meal times"), `<div class="times" id="times"></div><label class="f">${tr("Przypomnij, jeśli nikt nie nakarmił po (min)","Remind if nobody fed after (min)")}</label><input type="number" id="sGrace" min="0" max="240" value="${c.tasks.feed.grace_min}">`);
  const tm = $("times"); const addT = v => { const w = document.createElement("span"); w.innerHTML = `<input type="time" value="${v}"><button class="link">×</button>`; w.querySelector("button").onclick = () => w.remove(); tm.append(w); };
  c.tasks.feed.times.forEach(addT); const ad = document.createElement("button"); ad.className = "link"; ad.textContent = "+ " + tr("godzina","time"); ad.onclick = () => addT("12:00"); tm.append(ad);
  h(tr("Przypomnienia","Reminders"), `<div class="row"><div class="grow"><label class="f">${tr("Cisza od","Quiet from")}</label><input type="time" id="sQ0" value="${c.quiet[0]}"></div><div class="grow"><label class="f">${tr("do","until")}</label><input type="time" id="sQ1" value="${c.quiet[1]}"></div></div>
    <label class="f">${tr("Powtarzaj co (min)","Repeat every (min)")}</label><input type="number" id="sRep" min="10" max="720" value="${c.repeat_min}">
    <div class="hint" style="margin-top:8px">${S.notify.length ? tr("Telefony: ","Phones: ") + esc(S.notify.join(", ")) : tr("Telefony ustawisz w Konfiguracji dodatku (notify_services).","Set phones in the add-on Configuration (notify_services).")}</div>
    ${S.notify.length ? `<div class="row"><button class="b alt sm" id="tst">${tr("Wyślij test","Send a test")}</button></div>` : ""}`);
  const sv = document.createElement("div"); sv.className = "row"; sv.innerHTML = `<button class="b" id="save">${tr("Zapisz","Save")}</button>`; b.append(sv);
  h("Home Assistant", `<div class="kv"><span>${tr("Sensory","Sensors")}</span><span>sensor.${esc(S.sensors)}_last_fed, sensor.${esc(S.sensors)}_litter, ... binary_sensor.${esc(S.sensors)}_needs_attention</span><span>${tr("Zdarzenie","Event")}</span><span>hafreudteo_logged</span></div>`);
  if(S.api_enabled) tokensUI(h(tr("Skróty i Siri","Shortcuts and Siri"), `<div class="hint">${tr("Skrót: Pobierz zawartość URL → POST na ","Shortcut: Get Contents of URL → POST to ")}<code>http://&lt;HA-IP&gt;:${S.api_port}/api/log</code>${tr(" z nagłówkiem Authorization: Bearer <token> i treścią JSON ",' with header Authorization: Bearer &lt;token&gt; and JSON body ')}<code>{"task":"feed"}</code>. ${tr("Odpowiedź w polu reply można odczytać na głos.","Read the reply field aloud.")}</div><div class="in" style="margin-top:8px"><input type="text" id="tkName" placeholder="iPhone"><button class="b alt" id="tkNew">${tr("Utwórz token","Create token")}</button></div><div id="tkOut"></div><div id="tkList"></div>`));
  $("avUp").onclick = () => $("avFile").click();
  $("avFile").onchange = async e => { const f0 = e.target.files[0]; if(f0) try{ await upAvatar(f0); }catch(x){ HL.toast(x.message, true); } };
  $("avDel").onclick = async () => { await HL.api("avatar", {method:"DELETE"}); S._av = Date.now(); render(); };
  if($("tst")) $("tst").onclick = async () => { try{ await HL.post("test"); HL.toast(tr("Wysłano","Sent")); }catch(x){ HL.toast(x.message, true); } };
  $("save").onclick = saveSettings;
}
async function upAvatar(file){
  const img = await createImageBitmap(file), n = 384, k = Math.min(img.width, img.height), cv = document.createElement("canvas"); cv.width = cv.height = n;
  cv.getContext("2d").drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, n, n);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", .85));
  const r = await fetch("api/avatar", {method:"POST", body:blob}); if(!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  S._av = Date.now(); render(); HL.toast(tr("Zapisano","Saved"));
}
async function saveSettings(){
  const tasks = {};
  document.querySelectorAll(".tk").forEach(r => { const id = r.dataset.id; tasks[id] = {enabled: r.querySelector(".en").checked, remind: r.querySelector(".rm").checked}; if(id !== "feed") tasks[id].every_h = Math.max(1, Math.round(+r.querySelector(".iv").value * 24)); });
  tasks.feed.times = [...document.querySelectorAll("#times input[type=time]")].map(i => i.value).filter(Boolean); tasks.feed.grace_min = +$("sGrace").value;
  try{ localStorage.setItem("hft_who", $("sWho").value.trim()); }catch{}
  try{ await HL.post("settings", {name:$("sName").value, birthday:$("sBd").value, portion_g:+$("sPortion").value, quiet:[$("sQ0").value, $("sQ1").value], repeat_min:+$("sRep").value, tasks}); HL.toast(tr("Zapisano","Saved")); await load(); }
  catch(e){ HL.toast(e.message, true); }
}
function tokensUI(card){
  const list = async () => { const r = await HL.api("tokens"); $("tkList").innerHTML = ""; r.forEach(t => { const d = document.createElement("div"); d.className = "ev"; d.innerHTML = `<span class="n">${esc(t.name)} <small>${t.last ? HL.ago(t.last) : tr("nieużywany","unused")}</small></span><button class="link cp">${tr("Kopiuj","Copy")}</button><button class="link del">${tr("Usuń","Delete")}</button>`;
    d.querySelector(".cp").onclick = async () => { const v = (await HL.api("tokens/" + t.id + "/secret")).token; try{ await navigator.clipboard.writeText(v); HL.toast(tr("Skopiowano","Copied")); }catch{ $("tkOut").innerHTML = ""; $("tkOut").append(HL.copyRow("Token", v)); } };
    d.querySelector(".del").onclick = async () => { await HL.api("tokens/" + t.id, {method:"DELETE"}); list(); }; $("tkList").append(d); }); };
  $("tkNew").onclick = async () => { const o = await HL.post("tokens", {name:$("tkName").value}); $("tkOut").innerHTML = ""; $("tkOut").append(HL.copyRow("Token", o.token)); list(); };
  list();
}
show("today"); load(); setInterval(() => { if(!document.hidden && tab !== "set") load(); }, 20000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
</script>
</body>
</html>
